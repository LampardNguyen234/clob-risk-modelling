<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Listing Screener — RISEx</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    :root {
      --bg:        #0a0b0f;
      --surface:   #12141a;
      --elevated:  #1a1d26;
      --border:    #252836;
      --orange:    #f97316;
      --amber:     #fb923c;
      --text:      #f1f5f9;
      --muted:     #94a3b8;
      --green:     #22c55e;
      --red:       #ef4444;
      --yellow:    #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(249,115,22,0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none; z-index: 0;
    }
    header, #main-content { position: relative; z-index: 1; }

    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #252836; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #374151; }

    .token-card.active {
      background: var(--elevated);
      border-color: var(--orange) !important;
    }
    .token-card:hover:not(.active) {
      background: #15171f;
      border-color: #2d3042 !important;
    }

    .metric-row:hover { background: rgba(249,115,22,0.04); }
    .metric-row { cursor: pointer; }

    .gate-card {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 6px;
    }

    .accordion-content {
      max-height: 0; overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }
    .accordion-content.open { max-height: 500px; opacity: 1; }

    .exchange-badge {
      background: rgba(96,165,250,0.10); border: 1px solid rgba(96,165,250,0.25);
      border-radius: 6px; padding: 4px 10px;
      font-size: 11px; font-weight: 700; color: #93c5fd;
      text-transform: capitalize; white-space: nowrap;
    }
    .exchange-badge.t1 { background: rgba(249,115,22,0.12); border-color: rgba(249,115,22,0.35); color: var(--orange); }
    .exchange-badge.t2 { background: rgba(96,165,250,0.10); border-color: rgba(96,165,250,0.28); color: #93c5fd; }

    .tier-prime    { background: rgba(249,115,22,0.15); color: #f97316; border: 1px solid rgba(249,115,22,0.3); }
    .tier-major    { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.25); }
    .tier-midcap   { background: rgba(168,85,247,0.12); color: #c084fc; border: 1px solid rgba(168,85,247,0.25); }
    .tier-smallcap { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }
    .tier-microcap { background: rgba(245,158,11,0.10); color: #d97706; border: 1px solid rgba(245,158,11,0.20); }
    .tier-rejected { background: rgba(239,68,68,0.10);  color: #ef4444; border: 1px solid rgba(239,68,68,0.20); }

    .header-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      opacity: 0.4;
    }

    #detail-panel { opacity: 1; transition: opacity 0.2s ease; }
    #detail-panel.fade-out { opacity: 0; }

    #left-panel {
      width: 280px; min-width: 280px; flex-shrink: 0;
      display: flex; flex-direction: column; height: 100%;
      border-right: 1px solid var(--border); background: var(--surface);
    }
    #right-panel { flex: 1; overflow-y: auto; height: 100%; display: flex; align-items: flex-start; }
    #detail-panel { flex: 1 1 900px; min-width: 0; }
    #side-rail {
      width: 560px;
      flex: 0 0 560px;
      padding: 28px 28px 28px 0;
      position: sticky;
      top: 0;
      align-self: flex-start;
    }
    #main-content { display: flex; flex: 1; overflow: hidden; }

    .config-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .config-row:last-child { border-bottom: none; }

    .filter-btn {
      flex: 1; padding: 5px 0;
      font-size: 11px; font-weight: 600; border-radius: 6px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); cursor: pointer; transition: all 0.15s;
      letter-spacing: 0.3px;
    }
    .filter-btn.active {
      background: rgba(249,115,22,0.15);
      border-color: rgba(249,115,22,0.4); color: var(--orange);
    }
    .filter-btn:hover:not(.active) { background: var(--elevated); color: var(--text); }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }
    .icon-btn:hover:not(:disabled) {
      color: var(--orange);
      border-color: rgba(249,115,22,0.45);
      background: rgba(249,115,22,0.08);
    }
    .icon-btn:disabled {
      cursor: wait;
      opacity: 0.55;
    }
    .info-wrap { position: relative; display: inline-flex; align-items: center; }
    .info-trigger {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1px solid rgba(148,163,184,0.35);
      background: rgba(148,163,184,0.08);
      color: var(--muted); display: inline-flex; align-items: center; justify-content: center;
      cursor: help; padding: 0;
    }
    .info-trigger:hover, .info-trigger:focus {
      color: var(--orange); border-color: rgba(249,115,22,0.45);
      outline: none;
    }
    .info-popover {
      display: none; position: absolute; left: 0; top: 24px; z-index: 5;
      width: 300px; padding: 12px 14px; border-radius: 8px;
      background: #0e1016; border: 1px solid var(--border);
      box-shadow: 0 14px 40px rgba(0,0,0,0.38);
    }
    .info-wrap:hover .info-popover, .info-wrap:focus-within .info-popover { display: block; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--orange);
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    .spinner-sm {
      width: 12px; height: 12px; border-radius: 50%;
      border: 1.5px solid var(--border); border-top-color: var(--muted);
      animation: spin 0.7s linear infinite; flex-shrink: 0; display: inline-block;
    }
    .sync-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(34,197,94,0.28);
      background: rgba(34,197,94,0.08);
      color: var(--green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .sync-btn:hover:not(:disabled) {
      background: rgba(34,197,94,0.14);
      border-color: rgba(34,197,94,0.45);
    }
    .sync-btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }
    .sync-btn svg { width: 15px; height: 15px; }
    .sync-btn.refreshing svg { animation: spin 0.7s linear infinite; }
    .settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(3, 5, 10, 0.72);
      backdrop-filter: blur(8px);
      align-items: flex-start;
      justify-content: flex-end;
      padding: 72px 24px 24px;
    }
    .settings-overlay.open { display: flex; }
    .settings-panel {
      width: min(560px, 100%);
      max-height: calc(100vh - 96px);
      overflow-y: auto;
      background: #10131b;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 28px 70px rgba(0,0,0,0.45);
    }
    .settings-section {
      padding: 16px 18px;
      border-top: 1px solid var(--border);
    }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .setting-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .setting-field label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: 0.45px;
      text-transform: uppercase;
    }
    .setting-field input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: 700 13px 'JetBrains Mono', monospace;
      padding: 9px 10px;
      outline: none;
    }
    .setting-field input:focus {
      border-color: rgba(249,115,22,0.55);
      box-shadow: 0 0 0 2px rgba(249,115,22,0.10);
    }
    .setting-field input:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      background: #0d1017;
    }
    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: rgba(26,29,38,0.72);
    }
    .text-btn {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .text-btn:hover { color: var(--text); border-color: #3a4054; }
    .text-btn.primary {
      color: #0a0b0f;
      background: var(--orange);
      border-color: var(--orange);
    }
    .rise-market-grid {
      display: grid;
      grid-template-columns: 22px minmax(86px,118px) 42px minmax(72px,1fr) 58px 68px 76px;
      column-gap: 6px;
      align-items: center;
    }
    .rise-market-head {
      padding: 9px 14px 9px 8px;
      border-bottom: 1px solid var(--border);
    }
    .rise-market-row {
      padding: 0 14px 0 8px;
      border-bottom: 1px solid var(--border);
    }
    .rise-market-status {
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rise-market-status.live { color: var(--green); }
    .rise-market-status.post-only { color: var(--yellow); }
    .rise-market-status.offline { color: var(--red); }

    @media (max-width: 1280px) {
      #right-panel { flex-direction: column; }
      #detail-panel { width: 100%; }
      #side-rail { width: 100%; flex: none; padding: 0 32px 28px; position: static; }
    }

    @media (max-width: 768px) {
      body { overflow: auto; height: auto; }
      #main-content { flex-direction: column; overflow: visible; }
      #left-panel {
        width: 100%; min-width: unset; height: auto; max-height: 320px;
        border-right: none; border-bottom: 1px solid var(--border);
      }
      #right-panel { height: auto; overflow: visible; flex-direction: column; }
      #side-rail { width: 100%; flex: none; padding: 0 32px 28px; position: static; }
      .settings-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header style="background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;">
  <div style="max-width:100%;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:12px;">
      <img src="https://www.rise.trade/assets/risex-big-logo.svg" alt="RISEx"
           style="height:28px;width:auto;"
           onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex';" />
      <div id="logo-fallback" style="display:none;align-items:center;gap:8px;">
        <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#f97316,#fb923c);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#0a0b0f;">R</div>
        <span style="font-weight:700;font-size:16px;color:var(--text);letter-spacing:-0.3px;">RISEx</span>
      </div>
      <div style="width:1px;height:18px;background:var(--border);margin:0 4px;"></div>
      <span style="font-size:13px;color:var(--muted);font-weight:500;">Token Listing Screener</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="sync-stamp" style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:0.3px;">LAST SYNC: —</span>
      <button id="auto-refresh-btn" class="sync-btn" onclick="manualAutoRefresh()" title="Refresh now; auto-refreshes every 60s" aria-label="Refresh now; auto-refreshes every 60s">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 00-15.74-5.74L3 8"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v5h5"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12a9 9 0 0015.74 5.74L21 16"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 16h5v5"/>
        </svg>
      </button>
      <div style="width:1px;height:16px;background:var(--border);"></div>
      <div style="background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:6px;">
        <div style="width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;"></div>
        LIVE
      </div>
      <button class="icon-btn" onclick="openSettings()" title="Adjust scoring settings" aria-label="Adjust scoring settings">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="header-line"></div>
</header>

<div id="settings-overlay" class="settings-overlay" onclick="if(event.target===this) closeSettings();">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;">
      <div>
        <h2 id="settings-title" style="font-size:15px;font-weight:800;color:var(--text);margin:0;">Settings</h2>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">Updates cached scores and listing config without refetching market data.</div>
      </div>
      <button class="icon-btn" onclick="closeSettings()" title="Close settings" aria-label="Close settings">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form id="settings-form" onsubmit="applySettings(event)">
      <div id="settings-body"></div>
      <div class="settings-actions">
        <button type="button" class="text-btn" onclick="resetSettings()">Reset</button>
        <button type="button" class="text-btn" onclick="closeSettings()">Cancel</button>
        <button type="submit" class="text-btn primary">Apply</button>
      </div>
    </form>
  </div>
</div>

<div id="main-content">

  <!-- LEFT PANEL -->
  <div id="left-panel">
    <div style="padding:14px 12px 10px;flex-shrink:0;">
      <div style="position:relative;">
        <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="search-input" type="text" placeholder="Search any token..."
          style="width:100%;background:var(--elevated);border:1px solid var(--border);border-radius:8px;padding:8px 10px 8px 32px;font-size:13px;color:var(--text);outline:none;transition:border-color 0.2s;"
          onfocus="this.style.borderColor='rgba(249,115,22,0.5)'"
          onblur="this.style.borderColor='var(--border)'" />
        <div id="search-spinner" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);"><span class="spinner-sm"></span></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px;">
        <button class="filter-btn active" data-filter="all"      onclick="setFilter('all',this)">All</button>
        <button class="filter-btn"        data-filter="passing"  onclick="setFilter('passing',this)">Passing</button>
        <button class="filter-btn"        data-filter="rejected" onclick="setFilter('rejected',this)">Rejected</button>
      </div>
    </div>

    <div style="padding:0 12px 6px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;">
      <span id="list-count" style="font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;"></span>
      <span style="font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0.5px;">SCORE</span>
    </div>

    <div id="token-list" style="flex:1;overflow-y:auto;padding:0 6px 8px;"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right-panel">
    <div id="detail-panel" style="padding:28px 32px;max-width:900px;"></div>
    <aside id="side-rail"></aside>
  </div>

</div>

<script>
// ─── CONFIG (mirrors config.yml + notebook constants) ─────────────────────────
const CFG = {
  FDMC_MIN:         100_000_000,
  SAFETY_PASS_MIN:  75,
  SAFETY_COND_MIN:  60,
  AGE_MIN_DAYS:     180,
  EXPECTED_MIN_ORDER_USD: 10,

  // PRIME_WHITELIST: only these can stay in Prime tier after scoring
  PRIME_WHITELIST: new Set(['BTC', 'ETH']),

  TIER1: new Set(['binance','coinbase-exchange','okx','bybit','kraken','hyperliquid']),
  TIER2: new Set(['gate','bitget','kucoin','bitstamp','htx','mexc','bingx']),
  USD_QUOTES: new Set(['USDT','USDC','USD','USDH']),

  // CoinGecko market.identifier → CMC exchangeSlug (only differing entries)
  CG_TO_CMC: {
    'gdax':             'coinbase-exchange',
    'okex':             'okx',
    'bybit_spot':       'bybit',
    'hyperliquid-spot': 'hyperliquid',
    'huobi':            'htx',
    'mxc':              'mexc',
  },

  // Metric reference values (full score at v = ref)
  REFS:    { depth:10e6, vol:0.7642, es95:0.04, volume:500e6, conc:0.80, spread:0.0005 },
  WEIGHTS: { depth:30,   vol:10,     es95:20,   volume:20,   conc:10,   spread:10 },
  // Log-scaled metrics have a v_max above which score = 0
  VMAXES:  { vol:3.00, es95:0.20 },

  // Score → tier boundaries (>= threshold → tier)
  TIERS: [[90,'Prime'],[75,'Major'],[60,'Mid-Cap'],[45,'Small-Cap'],[25,'Micro-Cap'],[0,'Rejected']],

  // Tier parameters from notebook cell 2 TIER_PARAMS
  TIER_PARAMS: {
    'Prime':      { maxLev:25, imr:'4.00%',  mmr:'2.67%',  cmr:'1.78%',  oiLo:'$50M',  oiHi:'$120M' },
    'Major':      { maxLev:20, imr:'5.00%',  mmr:'3.33%',  cmr:'2.22%',  oiLo:'$10M',  oiHi:'$20M'  },
    'Mid-Cap':    { maxLev:10, imr:'10.00%', mmr:'6.67%',  cmr:'4.44%',  oiLo:'$2M',   oiHi:'$10M'  },
    'Small-Cap':  { maxLev:5,  imr:'20.00%', mmr:'13.33%', cmr:'8.89%',  oiLo:'$1M',   oiHi:'$5M'   },
    'Micro-Cap':  { maxLev:3,  imr:'33.33%', mmr:'22.22%', cmr:'14.81%', oiLo:'$1M',   oiHi:'$5M'   },
    'Rejected':   { maxLev:'—', imr:'—',     mmr:'—',      cmr:'—',      oiLo:'—',    oiHi:'—'     },
  },

  // Feed grade → maximum tier ceiling
  FEED_CEILING: { A:'Prime', B:'Major', C:'Small-Cap', D:'Micro-Cap', F:'Rejected' },
  TIER_ORDER: ['Prime','Major','Mid-Cap','Small-Cap','Micro-Cap','Rejected'],
};
const TIER_NAMES = ['Prime', 'Major', 'Mid-Cap', 'Small-Cap', 'Micro-Cap'];
const METRIC_REF_FIELDS = [
  ['depth',  '2% Market Depth',        'USD'],

let _cgLast = 0;
let _cgGate = Promise.resolve();
let _cgCooldownUntil = 0;
const _binancePerpCheckCache = new Map();

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

function errMsg(err) {
  if (!err) return 'Unavailable';
  if (err.name === 'AbortError') return 'Timed out';
  if (err.isRateLimit) return err.message || 'CoinGecko rate limited';
  return err.message || 'Unavailable';
}

async function fetchWithTimeout(url, options = {}, timeoutMs = 12000) {
  const ctrl = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: ctrl.signal });
  } finally {
    clearTimeout(timeout);
  }
}

// Update the text inside the loading panel without a full re-render.
function setLoadingMsg(msg) {
  const el = document.getElementById('loading-msg');
  if (el) el.textContent = msg;
}

async function paceCoinGecko() {
  let release;
  const prev = _cgGate;
  _cgGate = new Promise(resolve => { release = resolve; });
  await prev.catch(() => {});
  const wait = Math.max(0, _cgLast + CG_MIN_INTERVAL_MS - Date.now());
  if (wait > 0) await sleep(wait);
  _cgLast = Date.now();
  release();
}

function retryAfterMs(r, fallbackMs) {
  const raw = r.headers.get('retry-after');
  if (!raw) return fallbackMs;
  const seconds = Number(raw);
  if (Number.isFinite(seconds)) return Math.max(seconds * 1000, fallbackMs);
  const dateMs = Date.parse(raw);
  return Number.isFinite(dateMs) ? Math.max(dateMs - Date.now(), fallbackMs) : fallbackMs;
}

async function waitCoinGeckoRetry(ms, label) {
  const until = Date.now() + ms;
  _cgCooldownUntil = Math.max(_cgCooldownUntil, until);
  while (true) {
    const left = until - Date.now();
    if (left <= 0) return;
    setLoadingMsg(`${label} — retrying in ${Math.ceil(left / 1000)}s`);
    await sleep(Math.min(left, 1000));
  }
}

async function waitCoinGeckoCooldown() {
  const left = _cgCooldownUntil - Date.now();
  if (left > 0) await waitCoinGeckoRetry(left, 'CoinGecko cooldown');
}

function cgRateLimitError(ms) {
  const err = new Error('CoinGecko rate limited');
  err.isRateLimit = true;
  err.retryMs = ms;
  return err;
}

async function cgFetchDirect(path, attempt) {
  await waitCoinGeckoCooldown();
  await paceCoinGecko();

  let r;
  try {
    r = await fetchWithTimeout(CG_DIRECT + path, {}, 10000);
  } catch (netErr) {
    // CoinGecko 429 responses are sometimes CORS-masked by the browser as
    // generic network failures, so treat direct fetch failures as retryable.
    const err = new Error(`CoinGecko network/rate-limit wait`);
    err.isRetryable = true;
    err.retryMs = CG_RETRY_DELAYS_MS[Math.min(attempt, CG_RETRY_DELAYS_MS.length - 1)];
    return Promise.reject(err);
  }

  if (r.status === 429) {
    const fallback = CG_RETRY_DELAYS_MS[Math.min(attempt, CG_RETRY_DELAYS_MS.length - 1)];
    throw cgRateLimitError(retryAfterMs(r, fallback));
  }

  if (r.status >= 500) {
    const err = new Error(`CoinGecko ${r.status}`);
    err.isRetryable = true;
    err.retryMs = CG_RETRY_DELAYS_MS[Math.min(attempt, CG_RETRY_DELAYS_MS.length - 1)];
    throw err;
  }

  if (!r.ok) throw new Error(`CoinGecko ${r.status}`);
  return r.json();
}

async function cgFetchProxy(path) {
  const src = CG_SOURCES[1];
  const r = await fetchWithTimeout(src.url(path), {}, src.timeoutMs);
  if (!r.ok) throw new Error(`${src.name} ${r.status}`);
  return r.json();
}

// Retries direct CoinGecko on 429, CORS-masked 429s, and transient 5xxs. The
// public proxy is only a final fallback for non-rate-limit failures, so proxy
// timeouts do not mask expected free-tier rate limiting.
async function cgGet(path) {
  const MAX_ATTEMPTS = CG_RETRY_DELAYS_MS.length + 1;
  let lastErr = null;

  for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
    try {
      return await cgFetchDirect(path, attempt);
    } catch (err) {
      lastErr = err;
      const retryable = err.isRateLimit || err.isRetryable;
      if (!retryable || attempt === MAX_ATTEMPTS - 1) break;
      const waitMs = err.retryMs || CG_RETRY_DELAYS_MS[Math.min(attempt, CG_RETRY_DELAYS_MS.length - 1)];
      await waitCoinGeckoRetry(waitMs, err.isRateLimit ? 'CoinGecko rate limit' : 'CoinGecko temporary error');
    }
  }

  if (lastErr?.isRateLimit || lastErr?.isRetryable) {
    const err = new Error('CoinGecko rate limited; refresh after the cooldown completes');
    err.isRateLimit = true;
    throw err;
  }

  try {
    return await cgFetchProxy(path);
  } catch (proxyErr) {
    throw lastErr || proxyErr;
  }
}

function parseJinaJson(text) {
  const marker = 'Markdown Content:';
  const body = text.includes(marker) ? text.slice(text.indexOf(marker) + marker.length).trim() : text.trim();
  const start = body.indexOf('{');
  const end = body.lastIndexOf('}');
  if (start < 0 || end < start) throw new Error('CMC proxy returned non-JSON');
  return JSON.parse(body.slice(start, end + 1));
}

async function fetchBinancePerpCandidate(contractSymbol) {
  if (_binancePerpCheckCache.has(contractSymbol)) return _binancePerpCheckCache.get(contractSymbol);

  const p = fetchWithTimeout(
    `${BINANCE_FAPI_PREMIUM_INDEX}?symbol=${encodeURIComponent(contractSymbol)}`,
    {},
    8000
  ).then(async r => {
    let data = null;
    try { data = await r.json(); } catch {}
    if (!r.ok) throw new Error(`Binance futures ${r.status}`);
    if (data?.code === -1121) return null; // invalid symbol: not listed on Binance perps
    if (data?.symbol === contractSymbol && Number(data.markPrice) > 0) return data;
    return null;
  }).catch(err => {
    _binancePerpCheckCache.delete(contractSymbol);
    throw err;
  });

  _binancePerpCheckCache.set(contractSymbol, p);
  return p;
}

async function checkBinancePerp(symbol) {
  let lastErr = null;
  for (const contractSymbol of binancePerpSymbolCandidates(symbol)) {
    try {
      const data = await fetchBinancePerpCandidate(contractSymbol);
      if (data) {
        return { pass: true, value: `${data.symbol} perpetual` };
      }
    } catch (err) {
      lastErr = err;
    }
  }
  if (lastErr) throw lastErr;
  return { pass: false, value: 'No Binance perp' };
}

async function fetchJsonFromSources(sources, validate) {

    try {
      const r = await fetchWithTimeout(src.url, {}, src.timeoutMs);
      if (!r.ok) {
        lastErr = new Error(`${src.name} ${r.status}`);
        continue;

      if (validate && !validate(data)) {
        lastErr = new Error(`${src.name}: unexpected response`);
        continue;
      }
      return data;
    } catch (err) {
      lastErr = new Error(`${src.name}: ${errMsg(err)}`);
    }
  }
  throw lastErr || new Error('Unavailable');
}

function lighterMarginFraction(v) {
  const n = numOrNull(v);
  return n === null ? null : n / 10000;
}

function marginPct(v) {
  return v === null || v === undefined || !Number.isFinite(v) ? '—' : (v * 100).toFixed(2) + '%';
}

function levFromImr(imr) {
  return imr && Number.isFinite(imr) && imr > 0 ? Math.floor(1 / imr) : null;
}

function exchangeStatusLabel(status) {
  const s = String(status || '').toLowerCase();
  if (s === 'trading' || s === 'active') return 'ACTIVE';
  return String(status || 'active').toUpperCase();
}

function decimalStep(decimals) {
  const n = numOrNull(decimals);
  return n === null ? null : 10 ** (-n);
}

function hyperliquidPriceStep(price, szDecimals) {
  const px = numOrNull(price);
  const sz = numOrNull(szDecimals);
  if (!(px > 0) || sz === null) return null;
  const maxDecimalStep = 10 ** (-(6 - sz)); // perp prices: max decimals = 6 - szDecimals
  const sigFigStep = 10 ** (Math.floor(Math.log10(px)) - 4); // 5 significant figures
  return Math.max(maxDecimalStep, sigFigStep);
}

async function fetchLighterReference(symbol) {
  const data = await fetchJsonFromSources(
    LIGHTER_MARKET_SOURCES,
    data => Array.isArray(data?.order_book_details)
  );
  const want = refSymbol(symbol);
  const market = (data.order_book_details || []).find(m => {
    const mSym = refSymbol(String(m.symbol || '').split('/')[0]);
    return m.market_type === 'perp' && mSym === want && m.market_config?.hidden !== true;
  });
  if (!market) return { venue: 'Lighter', listed: false, note: 'No active perp market found' };

  const minImr = lighterMarginFraction(market.min_initial_margin_fraction);
  const defaultImr = lighterMarginFraction(market.default_initial_margin_fraction);
  const mmr = lighterMarginFraction(market.maintenance_margin_fraction);
  const cmr = lighterMarginFraction(market.closeout_margin_fraction);
  const orderLimit = numOrNull(market.order_quote_limit);
  const stepSize = decimalStep(market.supported_size_decimals ?? market.size_decimals);
  const stepPrice = decimalStep(market.supported_price_decimals ?? market.price_decimals);

  return {
    venue: 'Lighter',
    listed: true,
    market: market.symbol,
    status: market.status || 'active',
    maxLev: levFromImr(minImr),
    imr: minImr,
    mmr,
    cmr,
    stepSize,
    stepPrice,
    limit: orderLimit ? fmtBig(orderLimit) : '—',
    note: defaultImr && defaultImr !== minImr ? `Default IMR ${marginPct(defaultImr)}` : 'Public market margin fractions',
  };
}

async function fetchHyperliquidReference(symbol) {
  const combined = await hlPost({ type: 'metaAndAssetCtxs' });
  const meta = Array.isArray(combined) ? combined[0] : await hlPost({ type: 'meta' });
  const ctxs = Array.isArray(combined) ? combined[1] : [];
  if (!meta?.universe) throw new Error(_IS_FILE ? 'Skipped on file://' : 'Hyperliquid metadata unavailable');

  const want = hyperliquidSymbolCandidates(symbol);
  const assetIndex = (meta.universe || []).findIndex(a => want.has(a.name) && !a.isDelisted);
  const asset = assetIndex >= 0 ? meta.universe[assetIndex] : null;
  if (!asset) return { venue: 'Hyperliquid', listed: false, note: 'No active perp market found' };

  const table = (meta.marginTables || []).find(([id]) => Number(id) === Number(asset.marginTableId));
  const tiers = table?.[1]?.marginTiers || [];
  const firstTier = tiers[0] || null;
  const nextTier = tiers[1] || null;
  const maxLev = numOrNull(asset.maxLeverage) || numOrNull(firstTier?.maxLeverage);
  const ctx = Array.isArray(ctxs) ? ctxs[assetIndex] : null;
  const markPx = numOrNull(ctx?.markPx) || numOrNull(ctx?.midPx) || numOrNull(ctx?.oraclePx);

  return {
    venue: 'Hyperliquid',
    listed: true,
    market: asset.name,
    status: asset.onlyIsolated ? 'isolated' : 'active',
    maxLev,
    imr: maxLev ? 1 / maxLev : null,
    mmr: null,
    cmr: null,
    stepSize: decimalStep(asset.szDecimals),
    stepPrice: hyperliquidPriceStep(markPx, asset.szDecimals),
    limit: nextTier?.lowerBound ? `0 - ${fmtBig(Number(nextTier.lowerBound))}` : 'Flat',
    note: table?.[1]?.description
      ? `${table[1].description}; price tick is effective at current mark`
      : 'Public meta margin table; price tick is effective at current mark',
  };
}

async function fetchExchangeInfoReference(symbol, sources, venue, notListedNote) {
  const data = await fetchJsonFromSources(
    sources,
    data => Array.isArray(data?.symbols)
  );
  const candidates = binancePerpSymbolCandidates(symbol);
  const market = (data.symbols || []).find(s =>
    candidates.has(s.symbol) &&
    s.status === 'TRADING' &&
    String(s.contractType || '').includes('PERPETUAL')
  );
  if (!market) return { venue, listed: false, note: notListedNote };

  const reqPct = numOrNull(market.requiredMarginPercent);
  const maintPct = numOrNull(market.maintMarginPercent);
  const imr = reqPct === null ? null : reqPct / 100;
  const mmr = maintPct === null ? null : maintPct / 100;
  const minNotional = numOrNull((market.filters || []).find(f => f.filterType === 'MIN_NOTIONAL')?.notional);
  const priceFilter = (market.filters || []).find(f => f.filterType === 'PRICE_FILTER');
  const lotFilter = (market.filters || []).find(f => f.filterType === 'LOT_SIZE');

  return {
    venue,
    listed: true,
    market: market.symbol,
    status: market.status,
    maxLev: levFromImr(imr),
    imr,
    mmr,
    cmr: null,
    stepSize: numOrNull(lotFilter?.stepSize),
    stepPrice: numOrNull(priceFilter?.tickSize),
    limit: minNotional ? `Min ${fmtBig(minNotional)}` : '—',
    note: `${venue} public exchangeInfo baseline`,
  };
}

function emptyExchangeRefState(symbol) {
  return {
    symbol,
    status: 'loading',
    refs: {
      binance: { status: 'loading', data: null, error: null },
      hyperliquid: { status: 'loading', data: null, error: null },
      aster: { status: 'loading', data: null, error: null },
      lighter: { status: 'loading', data: null, error: null },
    },
    updatedAt: null,
  };
}

function updateExchangeRef(symbol, venue, patch) {
  const st = exchangeRefCache.get(symbol) || emptyExchangeRefState(symbol);
  st.refs[venue] = { ...st.refs[venue], ...patch };
  const refs = Object.values(st.refs);
  st.status = refs.some(r => r.status === 'loading') ? 'loading' : 'loaded';
  st.updatedAt = Date.now();
  exchangeRefCache.set(symbol, st);
  refreshExchangeReferenceSection(symbol);
}

function refreshExchangeReferenceSection(symbol) {
  if (refSymbol(symbol) !== refSymbol(_lastSelectedSymbol)) return;
  const el = document.getElementById('exchange-ref-section');
  if (el) el.innerHTML = renderExchangeReferenceSection(symbol);
}

async function loadExchangeReferences(symbol, force = false) {
  const sym = refSymbol(symbol);
  const current = exchangeRefCache.get(sym);
  if (!force && current && current.status !== 'error') return;

  exchangeRefCache.set(sym, emptyExchangeRefState(sym));
  refreshExchangeReferenceSection(sym);

  [
    ['binance', fetchBinanceReference],
    ['hyperliquid', fetchHyperliquidReference],
    ['aster', fetchAsterReference],
    ['lighter', fetchLighterReference],
  ].forEach(([venue, fn]) => {
    fn(sym)
      .then(data => updateExchangeRef(sym, venue, { status: 'loaded', data, error: null }))
      .catch(err => updateExchangeRef(sym, venue, { status: 'error', data: null, error: errMsg(err) }));
  });
}

async function hlPost(body) {
  if (_IS_FILE) return null;   // skip HL on file:// (POST not proxied)
  try {
    const r = await fetchWithTimeout(HL_DIRECT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }, 8000);
    if (!r.ok) return null;
    return r.json();
  } catch { return null; }
}

// ─── COMPUTE ──────────────────────────────────────────────────────────────────
function scoreMetric(v, ref, w, inverted, vmax = null) {
  if (!(v > 0)) return 0;
  if (!inverted) return Math.min(v / ref, 1.0) * w;
  if (v <= ref) return w;
  if (vmax !== null) {
    if (v >= vmax) return 0;
    return Math.max(1.0 - Math.log(v / ref) / Math.log(vmax / ref), 0) * w;
  }
  return Math.min(ref / v, 1.0) * w;
}

function scoreToTier(s) {
  for (const [thr, name] of CFG.TIERS) if (s >= thr) return name;
  return 'Rejected';
}

// More conservative (higher index in TIER_ORDER) wins
function capTier(tier, ceiling) {
  const a = CFG.TIER_ORDER.indexOf(tier);
  const b = CFG.TIER_ORDER.indexOf(ceiling);
  return a >= b ? tier : ceiling;
}

function computeFinalTier(symbol, rawTier, feedGrade, ageDays) {
  let t = capTier(rawTier, CFG.FEED_CEILING[feedGrade] || 'Micro-Cap');
  // Non-whitelisted tokens are capped at Major even if they score Prime
  if (t === 'Prime' && !CFG.PRIME_WHITELIST.has(symbol)) t = 'Major';
  // Tokens younger than AGE_MIN_DAYS are capped at Micro-Cap
  if (ageDays < CFG.AGE_MIN_DAYS) t = capTier(t, 'Micro-Cap');
  return t;
}

function normSlug(cgIdent) {
  return CFG.CG_TO_CMC[cgIdent] || cgIdent;
}

function todayUtcStartMs() {
  const now = new Date();
  return Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
}

function parseCMCDaily(historicalData) {
  const todayStart = todayUtcStartMs();
  const rows = [];
  for (const q of historicalData?.data?.quotes || []) {
    const quote = q.quote || {};
    const closeTs = Date.parse(q.timeClose || q.timeOpen || quote.timestamp || '');
    if (!Number.isFinite(closeTs) || closeTs >= todayStart) continue;
    const h = Number(quote.high), l = Number(quote.low), c = Number(quote.close);
    if (!(h > 0 && l > 0 && c > 0)) continue;
    rows.push({
      ts: Date.parse(q.timeOpen || q.timeClose || quote.timestamp || ''),
      h, l, c,
      volume: Number(quote.volume) || 0,
    });
  }
  return rows.sort((a, b) => a.ts - b.ts);
}

function dailyFromMarketChart(chartData) {
  const todayStart = todayUtcStartMs();
  const byDay = new Map();
  for (const [ts, price] of chartData.prices || []) {
    if (ts >= todayStart) continue;
    if (!(price > 0)) continue;
    const d = new Date(ts);
    const key = `${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`;
    const row = byDay.get(key) || { ts, c: price, volume: 0 };
    if (ts >= row.ts) { row.ts = ts; row.c = price; }
    byDay.set(key, row);
  }
  for (const [ts, vol] of chartData.total_volumes || []) {
    if (ts >= todayStart) continue;
    const d = new Date(ts);
    const key = `${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`;
    const row = byDay.get(key);
    if (row) row.volume = Number(vol) || 0;
  }
  return [...byDay.values()].sort((a, b) => a.ts - b.ts);
}

function parkinsonVolDaily(dailyRows) {
  const daily = dailyRows.filter(d => d.h > 0 && d.l > 0).slice(-90);
  const n = daily.length;
  if (n < 7) return { val: 0, days: n, flag: `insufficient (${n}d < 7d)` };
  let sum = 0, valid = 0;
  for (const { h, l } of daily) {
    if (h > 0 && l > 0 && h >= l) { sum += Math.log(h / l) ** 2; valid++; }
  }
  if (valid < 7) return { val: 0, days: valid, flag: `insufficient valid (${valid}d)` };
  return {
    val: Math.sqrt(365 * sum / (4 * valid * Math.LN2)),
    days: n,
    flag: n < 90 ? `short history (${n}d)` : null,
  };
}

function es95Daily(dailyRows) {
  const closes = dailyRows.map(d => d.c).filter(p => p > 0);
  if (closes.length < 21) return { val: 0, days: Math.max(closes.length - 1, 0), flag: 'insufficient history' };
  const logRet = [];
  for (let i = 1; i < closes.length; i++) logRet.push(Math.log(closes[i] / closes[i - 1]));
  logRet.sort((a, b) => a - b);
  const k = Math.floor(logRet.length * 0.05);
  const tail = logRet.slice(0, k + 1);
  const es = -tail.reduce((a, b) => a + b, 0) / tail.length;
  return {
    val: es,
    days: logRet.length,
    flag: logRet.length < 180 ? `short history (${logRet.length}d)` : null,
  };
}

function avgVolume30dDaily(dailyRows) {
  const vols = dailyRows.map(d => d.volume).filter(v => v >= 0).slice(-30);
  if (!vols.length) return 0;
  return vols.reduce((s, v) => s + v, 0) / vols.length;
}

// Aggregate 4h CoinGecko OHLC candles into daily candles for Parkinson vol.
// CoinGecko OHLC returns [[timestamp_ms, open, high, low, close], ...]
function aggregateToDaily(ohlcArr) {
  const days = {};
  for (const [ts, , h, l] of ohlcArr) {
    // Group by UTC date
    const d = new Date(ts);
    const key = `${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`;
    if (!days[key]) days[key] = { ts, h, l };
    else { days[key].h = Math.max(days[key].h, h); days[key].l = Math.min(days[key].l, l); }
  }
  return Object.values(days).sort((a, b) => a.ts - b.ts);
}

// Parkinson 1980 estimator: σ_ann = √(365/(4n·ln2) · Σln(H/L)²)
// Uses last 90 daily candles.
function parkinsonVol(ohlcArr) {
  const daily = aggregateToDaily(ohlcArr).slice(-90);
  const n = daily.length;
  if (n < 7) return { val: 0, days: n, flag: `insufficient (${n}d < 7d)` };
  let sum = 0, valid = 0;
  for (const { h, l } of daily) {
    if (h > 0 && l > 0 && h >= l) { sum += Math.log(h / l) ** 2; valid++; }
  }
  if (valid < 7) return { val: 0, days: valid, flag: `insufficient valid (${valid}d)` };
  return {
    val: Math.sqrt(365 * sum / (4 * valid * Math.LN2)),
    days: n,
    flag: n < 90 ? `short history (${n}d)` : null,
  };
}

// ES 95% = mean of worst 5% of daily log-return losses over all available history.
// prices: [[timestamp_ms, price], ...]
function es95(prices) {
  const closes = prices.map(p => p[1]).filter(p => p > 0);
  if (closes.length < 21) return { val: 0, days: closes.length - 1, flag: 'insufficient history' };
  const logRet = [];
  for (let i = 1; i < closes.length; i++) logRet.push(Math.log(closes[i] / closes[i - 1]));
  logRet.sort((a, b) => a - b);
  const k = Math.floor(logRet.length * 0.05);
  const tail = logRet.slice(0, k + 1);
  const es = -tail.reduce((a, b) => a + b, 0) / tail.length;
  return {
    val: es,
    days: logRet.length,
    flag: logRet.length < 180 ? `short history (${logRet.length}d)` : null,
  };
}

// 30-day average daily volume from CoinGecko market_chart total_volumes.
// volumes: [[timestamp_ms, usd_volume], ...]
function avgVolume30d(volumes) {
  if (!volumes || !volumes.length) return 0;
  const last30 = volumes.slice(-30);
  return last30.reduce((s, [, v]) => s + v, 0) / last30.length;
}

// Build per-exchange depth map from CoinGecko tickers (requires depth=true parameter).
function buildCGDepth(tickers) {
  const per = {};
  for (const t of tickers) {
    if (!CFG.USD_QUOTES.has(t.target)) continue;
    if (t.is_anomaly || t.is_stale) continue;
    const slug = normSlug(t.market?.identifier || '');
    const bid = t.cost_to_move_down_usd || 0;   // depth to move price down 2%
    const ask = t.cost_to_move_up_usd   || 0;   // depth to move price up 2%
    if (!bid && !ask) continue;
    if (!per[slug]) per[slug] = { bid: 0, ask: 0 };
    per[slug].bid += bid;
    per[slug].ask += ask;
  }
  return per;
}

// Compute qualified spot depth.
// h_e = 1.0 for Tier-1, 0.5 for Tier-2. HL L2 book takes priority for 'hyperliquid'.
function spotDepth(cgDepth, hlDepth) {
  const allSlugs = new Set([...Object.keys(cgDepth), ...Object.keys(hlDepth || {})]);
  let total = 0;
  for (const slug of allSlugs) {
    const isT1 = CFG.TIER1.has(slug), isT2 = CFG.TIER2.has(slug);
    if (!isT1 && !isT2) continue;
    const cg = cgDepth[slug] || { bid: 0, ask: 0 };
    const hl = (hlDepth || {})[slug] || { bid: 0, ask: 0 };
    // For HL slug, HL L2 takes priority; for others prefer CG
    const bid = slug === 'hyperliquid' ? (hl.bid || cg.bid) : (cg.bid || hl.bid);
    const ask = slug === 'hyperliquid' ? (hl.ask || cg.ask) : (cg.ask || hl.ask);
    total += (isT1 ? 1.0 : 0.5) * (bid + ask) / 2;
  }
  return total;
}

// 1 − HHI over T1/T2 exchange volume shares.
function concentration(tickers) {
  const vols = {};
  let total = 0;
  for (const t of tickers) {
    if (!CFG.USD_QUOTES.has(t.target)) continue;
    if (t.is_anomaly || t.is_stale) continue;
    const slug = normSlug(t.market?.identifier || '');
    if (!CFG.TIER1.has(slug) && !CFG.TIER2.has(slug)) continue;
    const v = t.converted_volume?.usd || 0;
    vols[slug] = (vols[slug] || 0) + v;
    total += v;
  }
  if (!total) return 0;
  const hhi = Object.values(vols).reduce((s, v) => s + (v / total) ** 2, 0);
  return 1.0 - hhi;
}

// Median bid-ask spread fraction across T1/T2 exchanges (median of per-exchange medians).
function bookSpread(tickers) {
  const perEx = {};
  for (const t of tickers) {
    if (!CFG.USD_QUOTES.has(t.target)) continue;
    if (t.is_anomaly || t.is_stale) continue;
    const slug = normSlug(t.market?.identifier || '');
    if (!CFG.TIER1.has(slug) && !CFG.TIER2.has(slug)) continue;
    const sp = t.bid_ask_spread_percentage;
    if (!sp || sp <= 0 || sp > 500) continue;
    if (!perEx[slug]) perEx[slug] = [];
    perEx[slug].push(sp);
  }
  const meds = Object.values(perEx).map(arr => {
    arr.sort((a, b) => a - b);
    const m = Math.floor(arr.length / 2);
    return arr.length % 2 ? arr[m] : (arr[m - 1] + arr[m]) / 2;
  });
  if (!meds.length) return 0;
  meds.sort((a, b) => a - b);
  const m = Math.floor(meds.length / 2);
  const med = meds.length % 2 ? meds[m] : (meds[m - 1] + meds[m]) / 2;
  return med / 100.0;  // convert percentage → fraction
}

// Spot ticker helper used only for exchange/venue metadata. The hard listing
// gate checks Binance perpetual futures via checkBinancePerp().
function isBinanceListed(tickers) {
  for (const t of tickers) {
    if (!CFG.USD_QUOTES.has(t.target)) continue;
    if (t.is_anomaly || t.is_stale) continue;
    if (normSlug(t.market?.identifier || '') === 'binance') return true;
  }
  return false;
}

// ─── ANALYSIS ─────────────────────────────────────────────────────────────────
async function analyzeToken(cgId, symbol, safetyScore, feedGrade) {
  if (resultCache.has(cgId)) return resultCache.get(cgId);

  analyzing = true;
  const steps = [
    'Fetching market data…',
    'Loading exchange tickers (page 1)…',
    'Loading exchange tickers (page 2)…',
    'Loading OHLC history (90d)…',
    'Loading price history (365d)…',
    'Querying Hyperliquid L2 book…',
    'Computing risk metrics…',
  ];
  let step = 0;
  const setStep = (s) => { step = s; renderLoading(steps[s]); };

  try {
    setStep(0);
    const detail = await cgGet(
      `/coins/${cgId}?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false`
    );

    setStep(1);
    const t1 = await cgGet(`/coins/${cgId}/tickers?include_exchange_logos=false&depth=true&page=1`);

    setStep(2);
    const t2 = await cgGet(`/coins/${cgId}/tickers?include_exchange_logos=false&depth=true&page=2`);

    setStep(3);
    const ohlcData = await cgGet(`/coins/${cgId}/ohlc?vs_currency=usd&days=90`);

    setStep(4);
    const chartData = await cgGet(`/coins/${cgId}/market_chart?vs_currency=usd&days=365&interval=daily`);

    setStep(5);
    // Hyperliquid L2 book — best-effort, failure does not block analysis
    const hlBook = await hlPost({ type: 'l2Book', coin: symbol, nSigFigs: 3 });

    setStep(6);
    const allTickers = [...(t1.tickers || []), ...(t2.tickers || [])];
    const binancePerp = await checkBinancePerp(symbol);
    const md = detail.market_data || {};
    const price = md.current_price?.usd || 0;
    const fdmc  = md.fully_diluted_valuation?.usd || md.market_cap?.usd || 0;
    const mcap  = md.market_cap?.usd || 0;
    const rank  = detail.market_cap_rank || null;
    const name  = detail.name || symbol;
    const thumb = detail.image?.thumb || null;

    // Hyperliquid L2 depth from order book
    let hlDepth = {};
    if (hlBook && Array.isArray(hlBook.levels) && price > 0) {
      const bids = hlBook.levels[0] || [];
      const asks = hlBook.levels[1] || [];
      const lo = price * 0.98, hi = price * 1.02;
      let bidD = 0, askD = 0;
      for (const lvl of bids) {
        const px = parseFloat(lvl.px), sz = parseFloat(lvl.sz);
        if (px >= lo) bidD += px * sz; else break;
      }
      for (const lvl of asks) {
        const px = parseFloat(lvl.px), sz = parseFloat(lvl.sz);
        if (px <= hi) askD += px * sz; else break;
      }
      hlDepth = { hyperliquid: { bid: bidD, ask: askD } };
    }

    const cgDepth = buildCGDepth(allTickers);
    const depthVal  = spotDepth(cgDepth, hlDepth);
    const parkRes   = parkinsonVol(ohlcData);
    const es95Res   = es95(chartData.prices || []);
    const volVal    = avgVolume30d(chartData.total_volumes || []);
    const concVal   = concentration(allTickers);
    const spreadVal = bookSpread(allTickers);

    const s1 = scoreMetric(depthVal,  CFG.REFS.depth,  CFG.WEIGHTS.depth,  false);
    const s2 = scoreMetric(parkRes.val,CFG.REFS.vol,   CFG.WEIGHTS.vol,    true,  CFG.VMAXES.vol);
    const s3 = scoreMetric(es95Res.val,CFG.REFS.es95,  CFG.WEIGHTS.es95,   true,  CFG.VMAXES.es95);
    const s4 = scoreMetric(volVal,    CFG.REFS.volume,  CFG.WEIGHTS.volume, false);
    const s5 = scoreMetric(concVal,   CFG.REFS.conc,    CFG.WEIGHTS.conc,   false);
    const s6 = scoreMetric(spreadVal, CFG.REFS.spread,  CFG.WEIGHTS.spread, true);
    const totalScore = Math.round((s1 + s2 + s3 + s4 + s5 + s6) * 10) / 10;

    // Age: number of daily returns available from market chart
    const ageDays = es95Res.days + 1;

    // Gates
    const fdmcPass    = fdmc >= CFG.FDMC_MIN;
    const binancePass = binancePerp.pass;
    const safetyPass  = safetyScore >= CFG.SAFETY_PASS_MIN;
    const safetyCond  = !safetyPass && safetyScore >= CFG.SAFETY_COND_MIN;
    const feedPass    = feedGrade !== 'F';
    const allPass     = fdmcPass && binancePass;

    // Tier assignment
    const rawTier   = allPass ? scoreToTier(totalScore) : 'Rejected';
    const finalTier = allPass ? computeFinalTier(symbol, rawTier, feedGrade, ageDays) : 'Rejected';
    const tierP     = CFG.TIER_PARAMS[finalTier] || CFG.TIER_PARAMS['Rejected'];
    const ageCapped = ageDays < CFG.AGE_MIN_DAYS;
    const whitelistCap = rawTier === 'Prime' && !CFG.PRIME_WHITELIST.has(symbol);

    // Exchange list (T1/T2 only)
    const exSet = new Set();
    for (const t of allTickers) {
      const slug = normSlug(t.market?.identifier || '');
      if (CFG.TIER1.has(slug) || CFG.TIER2.has(slug)) exSet.add(slug);
    }

    const result = {
      symbol, cgId, name, rank, price, fdmc, mcap, thumb,
      safetyScore, feedGrade,
      gates: {
        fdmc:    { pass: fdmcPass,   value: fmtBig(fdmc) + (fdmcPass ? ' ≥ $100M' : ' < $100M') },
        binance: { pass: binancePass, value: binancePerp.value },
        safety:  { pass: safetyPass || safetyCond, cond: safetyCond, value: `Score: ${safetyScore}/100${safetyCond ? ' (conditional, 14d pre-listing)' : ''}` },
        feed:    { pass: feedPass,   value: `Feed Grade: ${feedGrade}` },
      },
      allPass, ageCapped, whitelistCap, ageDays,
      metrics: {
        depth:  { val: depthVal,   score: s1, w: CFG.WEIGHTS.depth,  label: '2% Market Depth',          rawFmt: fmtBig(depthVal),            detail: METRIC_DETAILS.depth  },
        vol:    { val: parkRes.val,score: s2, w: CFG.WEIGHTS.vol,    label: 'Parkinson Vol (90d ann.)',  rawFmt: fmtPct(parkRes.val),         detail: METRIC_DETAILS.vol, flag: parkRes.flag  },
        es95:   { val: es95Res.val,score: s3, w: CFG.WEIGHTS.es95,   label: 'ES 95% (tail loss)',        rawFmt: fmtPct(es95Res.val),         detail: METRIC_DETAILS.es95, flag: es95Res.flag },
        volume: { val: volVal,     score: s4, w: CFG.WEIGHTS.volume, label: '30d Avg Daily Volume',      rawFmt: fmtBig(volVal) + '/d',        detail: METRIC_DETAILS.volume },
        conc:   { val: concVal,    score: s5, w: CFG.WEIGHTS.conc,   label: 'Concentration (1−HHI)',     rawFmt: concVal.toFixed(3),          detail: METRIC_DETAILS.conc  },
        spread: { val: spreadVal,  score: s6, w: CFG.WEIGHTS.spread, label: 'Avg Book Spread',           rawFmt: fmtPct(spreadVal),           detail: METRIC_DETAILS.spread },
      },
      totalScore, rawTier, finalTier, tierP,
      exchanges: [...exSet],
    };

    resultCache.set(cgId, result);

    // Update token list metadata
    const tok = tokenList.find(t => t.cgId === cgId);
    if (tok) { tok.name = name; tok.rank = rank; tok.thumb = thumb; }

    analyzing = false;
    return result;

  } catch (err) {
    analyzing = false;
    throw err;
  }
}

// ─── PROGRESSIVE ANALYSIS ────────────────────────────────────────────────────
// Fetches data in stages, calling renderProgressiveDetail after each stage so
// the user sees partial results immediately rather than waiting for all fetches.
// CoinGecko rate-limiter serializes CG calls, but HL and rendering are non-blocking.
async function analyzeTokenProg(cgId, symbol, safetyScore, feedGrade, cmcId = null) {
  const st = {
    cgId, symbol, safetyScore, feedGrade, cmcId,
    detail: null, tickers: null, binance: null, ohlc: null, chart: null, hl: null,
    errors: {}, complete: false,
  };
  const upd = () => renderProgressiveDetail(st);
  upd();

  const detailP = (async () => {
    try {
      const detailRaw = await cgGet(
        `/coins/${cgId}?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false`
      );
      const md = detailRaw.market_data || {};
      st.detail = {
        name:  detailRaw.name || symbol,
        thumb: detailRaw.image?.thumb || null,
        price: md.current_price?.usd || 0,
        fdmc:  md.fully_diluted_valuation?.usd || md.market_cap?.usd || 0,
        mcap:  md.market_cap?.usd || 0,
        rank:  detailRaw.market_cap_rank || null,
      };
    } catch (err) {
      st.errors.detail = errMsg(err);
    }
    upd();
  })();

  // Every data family runs independently. Partial sections update as soon as
  // their own response arrives, and failures are recorded without replacing the
  // whole panel with an error state.
  const tickersP = (async () => {
    const rows = [];
    const pages = [1, 2].map(page => cgGet(`/coins/${cgId}/tickers?include_exchange_logos=false&depth=true&page=${page}`)
      .then(data => {
        rows.push(...(data.tickers || []));
        const cgDepth = buildCGDepth(rows);
        const exSet = new Set();
        for (const t of rows) {
          const s = normSlug(t.market?.identifier || '');
          if (CFG.TIER1.has(s) || CFG.TIER2.has(s)) exSet.add(s);
        }
        st.tickers = {
          allTickers: [...rows],
          binancePass: isBinanceListed(rows),
          cgDepth,
          depthVal: spotDepth(cgDepth, st.hl?.hlDepth || {}),
          spreadVal: bookSpread(rows),
          concVal:  concentration(rows),
          exchanges: [...exSet],
        };
        upd();
      })
      .catch(err => {
        st.errors.tickers = errMsg(err);
        upd();
      }));

    await Promise.allSettled(pages);
    if (!rows.length && !st.errors.tickers) {
      st.errors.tickers = 'Unavailable';
      upd();
    }
  })();

  const binanceP = (async () => {
    try {
      st.binance = await checkBinancePerp(symbol);
    } catch (err) {
      st.errors.binance = errMsg(err);
    }
    upd();
  })();

  const historicalP = (async () => {
    if (!cmcId) return;
    try {
      const hist = await cmcHistorical(cmcId);
      const daily = parseCMCDaily(hist);
      if (!daily.length) throw new Error('No complete daily candles');
      st.ohlc = { parkRes: parkinsonVolDaily(daily), source: 'CMC' };
      st.chart = {
        es95Res: es95Daily(daily),
        volVal: avgVolume30dDaily(daily),
        ageDays: daily.length,
        source: 'CMC',
      };
    } catch (err) {
      st.errors.historical = errMsg(err);
    }
    upd();
  })();

  const ohlcP = (async () => {
    await historicalP;
    if (st.ohlc) return;
    try {
      const ohlcData = await cgGet(`/coins/${cgId}/ohlc?vs_currency=usd&days=30`);
      st.ohlc = { parkRes: parkinsonVol(ohlcData) };
    } catch (err) {
      st.errors.ohlc = st.errors.historical ? `${st.errors.historical}; ${errMsg(err)}` : errMsg(err);
    }
    upd();
  })();

  const chartP = (async () => {
    await historicalP;
    if (st.chart) return;
    try {
      const chartData = await cgGet(`/coins/${cgId}/market_chart?vs_currency=usd&days=365&interval=daily`);
      const daily = dailyFromMarketChart(chartData);
      st.chart = {
        es95Res: es95Daily(daily),
        volVal:  avgVolume30dDaily(daily),
        ageDays: daily.length,
        source: 'CoinGecko',
      };
    } catch (err) {
      st.errors.chart = st.errors.historical ? `${st.errors.historical}; ${errMsg(err)}` : errMsg(err);
    }
    upd();
  })();

  const hlP = (async () => {
    await detailP;
    if (!st.detail?.price) {
      st.hl = { hlDepth: {} };
      upd();
      return;
    }
    const hlBook = await hlPost({ type: 'l2Book', coin: symbol, nSigFigs: 3 });
    let hlDepth = {};
    if (hlBook && Array.isArray(hlBook.levels)) {
      const px0 = st.detail.price;
      const bids = hlBook.levels[0] || [], asks = hlBook.levels[1] || [];
      const lo = px0 * 0.98, hi = px0 * 1.02;
      let bidD = 0, askD = 0;
      for (const l of bids) { const p = parseFloat(l.px), s = parseFloat(l.sz); if (p >= lo) bidD += p * s; else break; }
      for (const l of asks) { const p = parseFloat(l.px), s = parseFloat(l.sz); if (p <= hi) askD += p * s; else break; }
      hlDepth = { hyperliquid: { bid: bidD, ask: askD } };
    }
    st.hl = { hlDepth };
    if (st.tickers) {
      st.tickers.depthVal = spotDepth(st.tickers.cgDepth, hlDepth);
    }
    upd();
  })();

  await Promise.allSettled([detailP, tickersP, binanceP, historicalP, ohlcP, chartP, hlP]);

  // Build final result from accumulated state
  const { detail: dk, tickers: tk, binance: bk, ohlc: ok, chart: ck, hl: hk } = st;
  st.complete = true;
  if (!dk || !tk || !bk || !ok || !ck) {
    upd();
    return null;
  }

  const hlDepth  = hk?.hlDepth || {};
  const depthVal = spotDepth(tk?.cgDepth || {}, hlDepth);
  const parkRes  = ok?.parkRes  || { val: 0, days: 0, flag: 'data unavailable' };
  const es95Res  = ck?.es95Res  || { val: 0, days: 0, flag: 'data unavailable' };
  const volVal   = ck?.volVal   || 0;
  const concVal  = tk?.concVal  || 0;
  const spreadVal = tk?.spreadVal || 0;
  const allTickers = tk?.allTickers || [];

  const s1 = scoreMetric(depthVal,   CFG.REFS.depth,  CFG.WEIGHTS.depth,  false);
  const s2 = scoreMetric(parkRes.val, CFG.REFS.vol,    CFG.WEIGHTS.vol,    true,  CFG.VMAXES.vol);
  const s3 = scoreMetric(es95Res.val, CFG.REFS.es95,   CFG.WEIGHTS.es95,   true,  CFG.VMAXES.es95);
  const s4 = scoreMetric(volVal,      CFG.REFS.volume,  CFG.WEIGHTS.volume, false);
  const s5 = scoreMetric(concVal,     CFG.REFS.conc,    CFG.WEIGHTS.conc,   false);
  const s6 = scoreMetric(spreadVal,   CFG.REFS.spread,  CFG.WEIGHTS.spread, true);
  const totalScore = Math.round((s1 + s2 + s3 + s4 + s5 + s6) * 10) / 10;

  const ageDays    = ck?.ageDays ?? ((es95Res.days || 0) + 1);
  const fdmcPass   = (dk?.fdmc || 0) >= CFG.FDMC_MIN;
  const binPass    = bk?.pass ?? false;
  const safetyPass = safetyScore >= CFG.SAFETY_PASS_MIN;
  const safetyCond = !safetyPass && safetyScore >= CFG.SAFETY_COND_MIN;
  const feedPass   = feedGrade !== 'F';
  const allPass    = fdmcPass && binPass;
  const rawTier    = allPass ? scoreToTier(totalScore) : 'Rejected';
  const finalTier  = allPass ? computeFinalTier(symbol, rawTier, feedGrade, ageDays) : 'Rejected';
  const tierP      = CFG.TIER_PARAMS[finalTier] || CFG.TIER_PARAMS['Rejected'];
  const ageCapped  = ageDays < CFG.AGE_MIN_DAYS;
  const whitelistCap = rawTier === 'Prime' && !CFG.PRIME_WHITELIST.has(symbol);

  const exSet = new Set();
  for (const t of allTickers) {
    const s = normSlug(t.market?.identifier || '');
    if (CFG.TIER1.has(s) || CFG.TIER2.has(s)) exSet.add(s);
  }

  const result = {
    symbol, cgId,
    name:  dk?.name  || symbol,
    rank:  dk?.rank  || null,
    price: dk?.price || 0,
    fdmc:  dk?.fdmc  || 0,
    mcap:  dk?.mcap  || 0,
    thumb: dk?.thumb || null,
    safetyScore, feedGrade,
    gates: {
      fdmc:    { pass: fdmcPass,  value: fmtBig(dk?.fdmc||0) + (fdmcPass ? ' ≥ $100M' : ' < $100M') },
      binance: { pass: binPass,   value: bk?.value || (binPass ? 'Binance perp listed' : 'No Binance perp') },
      safety:  { pass: safetyPass||safetyCond, cond: safetyCond, value: `Score: ${safetyScore}/100${safetyCond ? ' (conditional, 14d pre-listing)' : ''}` },
      feed:    { pass: feedPass,  value: `Feed Grade: ${feedGrade}` },
    },
    allPass, ageCapped, whitelistCap, ageDays,
    metrics: {
      depth:  { val: depthVal,    score: s1, w: CFG.WEIGHTS.depth,  label: '2% Market Depth',          rawFmt: fmtBig(depthVal),          detail: METRIC_DETAILS.depth  },
      vol:    { val: parkRes.val, score: s2, w: CFG.WEIGHTS.vol,    label: 'Parkinson Vol (90d ann.)',  rawFmt: fmtPct(parkRes.val),        detail: METRIC_DETAILS.vol,   flag: parkRes.flag },
      es95:   { val: es95Res.val, score: s3, w: CFG.WEIGHTS.es95,   label: 'ES 95% (tail loss)',        rawFmt: fmtPct(es95Res.val),        detail: METRIC_DETAILS.es95,  flag: es95Res.flag },
      volume: { val: volVal,      score: s4, w: CFG.WEIGHTS.volume, label: '30d Avg Daily Volume',      rawFmt: fmtBig(volVal) + '/d',       detail: METRIC_DETAILS.volume },
      conc:   { val: concVal,     score: s5, w: CFG.WEIGHTS.conc,   label: 'Concentration (1−HHI)',     rawFmt: concVal.toFixed(3),          detail: METRIC_DETAILS.conc  },
      spread: { val: spreadVal,   score: s6, w: CFG.WEIGHTS.spread, label: 'Avg Book Spread',           rawFmt: fmtPct(spreadVal),           detail: METRIC_DETAILS.spread },
    },
    totalScore, rawTier, finalTier, tierP,
    exchanges: [...exSet],
  };

  resultCache.set(cgId, result);
  const tok = tokenList.find(t => t.cgId === cgId);
  if (tok) { tok.name = result.name; tok.rank = result.rank; tok.thumb = result.thumb; }

  return result;
}

// ─── FORMAT HELPERS ───────────────────────────────────────────────────────────
function fmtPrice(p) {
  if (!p) return '—';
  if (p >= 1000)  return '$' + p.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (p >= 1)     return '$' + p.toFixed(2);
  if (p >= 0.01)  return '$' + p.toFixed(3);
  return '$' + p.toFixed(5);
}
function fmtUsdPrecise(n) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '—';
  if (n >= 1) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  if (n >= 0.01) return '$' + n.toFixed(4);
  if (n >= 0.0001) return '$' + n.toFixed(6);
  return '$' + n.toExponential(2);
}
function fmtBig(n) {
  if (!n) return '$0';
  if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6)  return '$' + (n / 1e6).toFixed(0) + 'M';
  if (n >= 1e3)  return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
}
function fmtPct(v) {
  if (!v) return '0.00%';
  return (v * 100).toFixed(2) + '%';
}
function fmtQty(n, suffix = '') {
  if (n === null || n === undefined || !Number.isFinite(n)) return '—';
  const abs = Math.abs(n);
  const body = abs >= 1e9 ? (n / 1e9).toFixed(2) + 'B'
    : abs >= 1e6 ? (n / 1e6).toFixed(1) + 'M'
    : abs >= 1e3 ? (n / 1e3).toFixed(1) + 'K'
    : abs >= 10 ? n.toFixed(0)
    : abs >= 1 ? n.toFixed(2)
    : n.toFixed(4);
  return suffix ? `${body} ${suffix}` : body;
}
function fmtFunding(v) {
  if (v === null || v === undefined || !Number.isFinite(v)) return '—';
  return (v * 100).toFixed(4) + '%';
}
function fmtPlainInt(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'bigint') return v.toString();
  if (!Number.isFinite(v)) return '—';
  return Math.round(v).toLocaleString('en-US');
}
function fmtFactorExpr(v) {
  if (v === null || v === undefined) return '—';
  let n = typeof v === 'bigint' ? v : BigInt(Math.round(v));
  if (n === 0n) return '0';
  const oneE18 = 1000000000000000000n;
  if (n % oneE18 === 0n) return `${(n / oneE18).toString()} * 1e18`;
  let exp = 0;
  while (n % 10n === 0n) {
    n /= 10n;
    exp++;
  }
  return exp ? `${n.toString()} * 1e${exp}` : n.toString();
}
function fmtDecimal(v) {
  if (v === null || v === undefined || !Number.isFinite(v)) return '—';
  const abs = Math.abs(v);
  if (abs >= 1000) return v.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (abs >= 1) return String(Number(v.toFixed(8)));
  return v.toFixed(Math.min(12, Math.max(0, Math.ceil(-Math.log10(abs || 1)) + 2))).replace(/0+$/, '').replace(/\.$/, '');
}
function fmtConfigPct(v) {
  return v === null || v === undefined || !Number.isFinite(v) ? '—' : (v * 100).toFixed(2) + '%';
}
function fmtBps(v) {
  return v === null || v === undefined || !Number.isFinite(v) ? '—' : (v * 10000).toFixed(2) + ' bps';
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}
function jsStr(v) {
  return JSON.stringify(String(v ?? ''));
}

function moneyToUsd(s) {
  const raw = String(s || '').trim().replace(/[$,\s]/g, '').toUpperCase();
  if (!raw || raw === '—') return null;
  const mult = raw.endsWith('B') ? 1e9 : raw.endsWith('M') ? 1e6 : raw.endsWith('K') ? 1e3 : 1;
  const n = Number(raw.replace(/[BMK]$/, ''));
  return Number.isFinite(n) ? n * mult : null;
}

// ─── SETTINGS ────────────────────────────────────────────────────────────────
const SETTINGS_STORAGE_KEY = 'risex-listing-screener-settings-v1';

function tierInputId(tier) {
  return 'setting-tier-' + tier.toLowerCase().replace(/[^a-z0-9]+/g, '-');
}

function refInputId(key) {
  return 'setting-ref-' + key;
}

function tierParamInputId(tier, key) {
  return 'setting-tier-param-' + tier.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + key;
}

function tierThresholdMap() {
  return Object.fromEntries(TIER_NAMES.map(name => {
    const row = CFG.TIERS.find(([, tier]) => tier === name);
    return [name, row ? row[0] : 0];
  }));
}

function tierRuleText() {
  const byTier = tierThresholdMap();
  return TIER_NAMES.map(t => `${t} >= ${fmtDecimal(byTier[t])}`).join(', ') + '.';
}

function normalizePositiveNumber(value, fallback, min = 0) {
  const n = Number(value);
  return Number.isFinite(n) && n >= min ? n : fallback;
}

function moneyInputToDisplay(value, fallback) {
  const raw = String(value ?? '').trim();
  const n = moneyToUsd(raw);
  if (!(n > 0)) return fallback;
  return fmtBig(n);
}

function tierParamsPayload() {
  return Object.fromEntries(TIER_NAMES.map(tier => [tier, { ...CFG.TIER_PARAMS[tier] }]));
}

function applySettingsPayload(payload) {
  const refs = payload?.refs || {};
  CFG.REFS = {
    depth:  normalizePositiveNumber(refs.depth,  CFG.REFS.depth,  0.000001),
    vol:    normalizePositiveNumber(refs.vol,    CFG.REFS.vol,    0.000001),
    es95:   normalizePositiveNumber(refs.es95,   CFG.REFS.es95,   0.000001),
    volume: normalizePositiveNumber(refs.volume, CFG.REFS.volume, 0.000001),
    conc:   normalizePositiveNumber(refs.conc,   CFG.REFS.conc,   0.000001),
    spread: normalizePositiveNumber(refs.spread, CFG.REFS.spread, 0.000001),
  };

  const nextTiers = payload?.tiers || {};
  const tierFallbacks = tierThresholdMap();
  CFG.TIERS = TIER_NAMES
    .map(name => [normalizePositiveNumber(nextTiers[name], tierFallbacks[name], 0), name])
    .sort((a, b) => b[0] - a[0]);
  CFG.TIERS.push([0, 'Rejected']);

  const nextTierParams = payload?.tierParams || {};
  for (const tier of TIER_NAMES) {
    const current = CFG.TIER_PARAMS[tier];
    const incoming = nextTierParams[tier] || {};
    const maxLev = normalizePositiveNumber(incoming.maxLev, Number(current.maxLev), 0.000001);
    const imrPct = (1 / maxLev) * 100;
    const mmrPct = (2 / 3) * imrPct;
    const cmrPct = (2 / 3) * mmrPct;
    CFG.TIER_PARAMS[tier] = {
      maxLev,
      imr: fmtConfigPct(imrPct / 100),
      mmr: fmtConfigPct(mmrPct / 100),
      cmr: fmtConfigPct(cmrPct / 100),
      oiLo: moneyInputToDisplay(incoming.oiLo, current.oiLo),
      oiHi: moneyInputToDisplay(incoming.oiHi, current.oiHi),
    };
  }

  CFG.EXPECTED_MIN_ORDER_USD = normalizePositiveNumber(
    payload?.expectedMinOrderUsd,
    CFG.EXPECTED_MIN_ORDER_USD,
    0.000001
  );
}

function currentSettingsPayload() {
  return {
    refs: { ...CFG.REFS },
    tiers: tierThresholdMap(),
    tierParams: tierParamsPayload(),
    expectedMinOrderUsd: CFG.EXPECTED_MIN_ORDER_USD,
  };
}

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(currentSettingsPayload()));
  } catch {}
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
    if (raw) applySettingsPayload(JSON.parse(raw));
  } catch {}
}

function recomputeResultScores(r) {
  if (!r?.metrics) return r;
  const m = r.metrics;
  const scores = {
    depth:  scoreMetric(m.depth?.val,  CFG.REFS.depth,  CFG.WEIGHTS.depth,  false),
    vol:    scoreMetric(m.vol?.val,    CFG.REFS.vol,    CFG.WEIGHTS.vol,    true,  CFG.VMAXES.vol),
    es95:   scoreMetric(m.es95?.val,   CFG.REFS.es95,   CFG.WEIGHTS.es95,   true,  CFG.VMAXES.es95),
    volume: scoreMetric(m.volume?.val, CFG.REFS.volume, CFG.WEIGHTS.volume, false),
    conc:   scoreMetric(m.conc?.val,   CFG.REFS.conc,   CFG.WEIGHTS.conc,   false),
    spread: scoreMetric(m.spread?.val, CFG.REFS.spread, CFG.WEIGHTS.spread, true),
  };
  for (const [key, score] of Object.entries(scores)) {
    if (m[key]) {
      m[key].score = score;
      m[key].w = CFG.WEIGHTS[key];
    }
  }
  r.totalScore = Math.round(Object.values(scores).reduce((sum, v) => sum + v, 0) * 10) / 10;
  r.rawTier = r.allPass ? scoreToTier(r.totalScore) : 'Rejected';
  r.finalTier = r.allPass ? computeFinalTier(r.symbol, r.rawTier, r.feedGrade, r.ageDays) : 'Rejected';
  r.tierP = CFG.TIER_PARAMS[r.finalTier] || CFG.TIER_PARAMS['Rejected'];
  r.whitelistCap = r.rawTier === 'Prime' && !CFG.PRIME_WHITELIST.has(r.symbol);
  r.ageCapped = r.ageDays < CFG.AGE_MIN_DAYS;
  return r;
}

function rerenderAfterSettings() {
  for (const r of resultCache.values()) recomputeResultScores(r);
  renderTokenList();
  if (selectedCgId && resultCache.has(selectedCgId)) {
    renderDetail(resultCache.get(selectedCgId));
  } else if (!selectedCgId) {
    renderWelcome();
  }
  refreshSideRail();
}

function renderSettingsBody() {
  const body = document.getElementById('settings-body');
  if (!body) return;
  const tiers = tierThresholdMap();

function cappedPower10ForNotional(price, maxUsd) {
  if (!(price > 0) || !(maxUsd > 0)) return { value: null, exp: null };
  const exp = Math.floor(Math.log10(maxUsd / price));
  return { value: 10 ** exp, exp };
}

function cappedPower10(target) {
  if (!(target > 0)) return { value: null, exp: null };
  const exp = Math.floor(Math.log10(target));
  return { value: 10 ** exp, exp };
}

function suggestedStepPrice(price) {
  if (!(price > 0)) return { value: null, exp: null };
  if (price >= 10000) return { value: 0.1, exp: -1 };
  if (price >= 1000) return { value: 0.01, exp: -2 };
  const hardcap = cappedPower10(price * 0.0001);
  if (price >= 100) {
    const v = hardcap.value === null ? null : Math.min(hardcap.value, 0.01);
    return { value: v, exp: v === 0.01 ? -2 : hardcap.exp };
  }
  return hardcap;
}

function roundToMultiple(value, multiple, minValue = multiple) {
  if (!(value > 0) || !(multiple > 0)) return minValue;
  return Math.max(minValue, Math.round(value / multiple) * multiple);
}

function oiLimitStepRound(value) {
  return value && value < 500000 ? 50000 : 500000;
}

function tierParams(tier) {
  return CFG.TIER_PARAMS[tier] || CFG.TIER_PARAMS['Rejected'];
}

function pctStringToFraction(value) {
  const n = Number(String(value ?? '').replace('%', '').trim());
  return Number.isFinite(n) ? n / 100 : null;
}

const ONE_E18 = 1000000000000000000n;
function mmFactorFromMaxLev(maxLev) {
  const n = Number(maxLev);
  if (!(n > 0)) return null;
  if (Number.isInteger(n) && n <= Number.MAX_SAFE_INTEGER) {
    return (BigInt(n) * 3n * ONE_E18) / 2n;
  }
  return BigInt(Math.round((3 * n / 2) * 1e18));
}

function computeSuggestedConfig(r, tier = r?.finalTier) {
  const tierP = tierParams(tier);
  const maxLev = Number(tierP?.maxLev);
  const price = Number(r?.price);
  if (!(maxLev > 0) || !(price > 0)) return null;

  const imr = 1 / maxLev;
  const mmr = (2 / 3) * imr;
  const mmFactor = mmFactorFromMaxLev(maxLev);
  const stepPrice = suggestedStepPrice(price);
  const stepSize = cappedPower10ForNotional(price, STEP_SIZE_MAX_USD);
  const stepNotional = stepSize.value ? stepSize.value * price : null;
  const minOrderStep = stepNotional ? roundToMultiple(CFG.EXPECTED_MIN_ORDER_USD / stepNotional, 5, 5) : null;
  const oiLowerUsd = moneyToUsd(tierP?.oiLo);
  const oiLimitRaw = oiLowerUsd && stepNotional ? oiLowerUsd / stepNotional : null;
  const oiRound = oiLimitStepRound(oiLimitRaw);
  const oiLimitSteps = oiLimitRaw ? roundToMultiple(oiLimitRaw, oiRound, oiRound) : null;

  return {
    maxLev,
    imr,
    mmr,
    mmFactor,
    stepPrice: stepPrice.value,
    stepSize: stepSize.value,
    minOrderStep,
    oiLimitSteps,
    maxOrderStep: oiLimitSteps ? Math.round(oiLimitSteps / 10) : null,
    priceBand: 0.05,
    impactNotional: 50,
    minOrderUsd: minOrderStep && stepNotional ? minOrderStep * stepNotional : null,
    oiLimitUsd: oiLimitSteps && stepNotional ? oiLimitSteps * stepNotional : null,
    tier,
    tierP,
  };
}

function finalTierForRawOption(r, rawTier) {
  if (!r?.allPass || rawTier === 'Rejected') return 'Rejected';
  return computeFinalTier(r.symbol, rawTier, r.feedGrade, r.ageDays);
}

function suggestedTierOptions(r) {
  if (!r?.allPass) return [];
  const options = new Set([r.finalTier]);
  const score = Number(r.totalScore);
  if (!Number.isFinite(score)) return [...options].filter(t => t && t !== 'Rejected');

  const boundaries = CFG.TIERS
    .filter(([, tier]) => tier !== 'Rejected')
    .map(([threshold, upperTier], i) => ({
      threshold,
      upperTier,
      lowerTier: CFG.TIERS[i + 1]?.[1],
    }))
    .filter(b => b.lowerTier);

  for (const b of boundaries) {
    if (Math.abs(score - b.threshold) <= b.threshold * 0.10) {
      options.add(finalTierForRawOption(r, b.upperTier));
      options.add(finalTierForRawOption(r, b.lowerTier));
    }
  }

  const rest = [...options]
    .filter(t => t && t !== 'Rejected' && t !== r.finalTier)
    .sort((a, b) => CFG.TIER_ORDER.indexOf(a) - CFG.TIER_ORDER.indexOf(b));
  return [r.finalTier, ...rest].filter(t => t && t !== 'Rejected');
}

function tierClass(tier) {
  const m = { Prime:'tier-prime', Major:'tier-major', 'Mid-Cap':'tier-midcap',
              'Small-Cap':'tier-smallcap', 'Micro-Cap':'tier-microcap' };
  return m[tier] || 'tier-rejected';
}
function tierColor(tier) {
  const m = { Prime:'#f97316', Major:'#60a5fa', 'Mid-Cap':'#c084fc',
              'Small-Cap':'#f59e0b', 'Micro-Cap':'#d97706' };
  return m[tier] || '#ef4444';
}
function scoreColor(s) {
  if (s >= 90) return '#f97316';
  if (s >= 75) return '#60a5fa';
  if (s >= 60) return '#c084fc';
  if (s >= 45) return '#f59e0b';
  if (s >= 25) return '#d97706';
  return '#ef4444';
}
function avatarColor(sym) {
  const pal = ['#f97316','#60a5fa','#a78bfa','#34d399','#f472b6','#fbbf24','#fb7185','#38bdf8'];
  let h = 0;
  for (let i = 0; i < sym.length; i++) h = (h * 31 + sym.charCodeAt(i)) & 0xffff;
  return pal[h % pal.length];
}
