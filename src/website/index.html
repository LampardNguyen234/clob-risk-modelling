    score: renorm({ d7: s7, d30: s30, oiVol: sOiVol }, { d7: 0.24, d30: 0.36, oiVol: 0.40 }),
    subs: [
      radarSub('OI Trend 7d', s7, 0.24, rho7 !== null ? `rho=${rho7.toFixed(2)}` : '—', 'Spearman OI trend over recent hourly values'),
      radarSub('OI Trend 30d', s30, 0.36, rho30 !== null ? `rho=${rho30.toFixed(2)}` : '—', 'Spearman OI trend over full 30d window'),
      radarSub('OI / Vol', sOiVol, 0.40, oiVolRatio !== null ? oiVolRatio.toFixed(3) + 'x' : (oiNotional ? fmtBig(oiNotional) : '—'), 'Trapezoid: full in [0.2,0.8], zero at ≤0.05 and ≥3.2'),
    ],
  };
}

function scoreRadarLevDetail(fundingHist, lastFundingRate) {
  const sorted = Array.isArray(fundingHist)
    ? [...fundingHist].sort((a, b) => a.fundingTime - b.fundingTime) : [];
  const rates = sorted.map(h => parseFloat(h.fundingRate));
  const n = rates.length;
  const fr = Number.isFinite(lastFundingRate) ? lastFundingRate : (n ? rates[n - 1] : null);
  const sLevel = (fr !== null && fr > 0) ? Math.min(1, Math.max(0, fr / 0.00015)) : 0;
  const sPersist = n >= 5 ? rates.filter(r => r > 0).length / n : null;

  const last7r = rates.slice(-7);
  const last7t = sorted.slice(-7).map(h => h.fundingTime);
  let sFlip = null, flipRaw = null;
  for (let i = last7r.length - 1; i > 0; i--) {
    if (last7r[i - 1] < 0 && last7r[i] > 0) {
      const hoursSince = (last7t[last7r.length - 1] - last7t[i]) / 3_600_000;
      sFlip = Math.max(0, 1 - hoursSince / 72);
      flipRaw = `${hoursSince.toFixed(0)}h ago`;
      break;
    }
  }
  if (sFlip === null) {
    sFlip = (fr !== null && fr > 0) ? 0.5 : 0;
    flipRaw = fr !== null && fr > 0 ? 'positive, no recent flip' : 'not positive';
  }

  return {
    score: renorm({ fund: sLevel, flip: sFlip, persist: sPersist }, { fund: 0.45, flip: 0.35, persist: 0.20 }),
    subs: [
      radarSub('Funding Level', sLevel, 0.45, fr !== null ? fmtFunding(fr) : '—', 'Positive only, full score at 0.015% per 8h'),
      radarSub('Funding Flip', sFlip, 0.35, flipRaw, 'Negative-to-positive flip with 72h decay'),
      radarSub('Funding Persistence', sPersist, 0.20, n ? `${rates.filter(r => r > 0).length}/${n} positive` : '—', 'Fraction of positive funding settlements'),
    ],
  };
}

function computeRadarR(b) {
  return Math.round(RADAR_W.att * b.att + RADAR_W.price * b.price + RADAR_W.vol * b.vol + RADAR_W.oi * b.oi + RADAR_W.lev * b.lev);
}

// ── SVG radar chart ───────────────────────────────────────────────────────────

function svgRadarChart(buckets, size = 110, color = '#f97316', showLabels = true) {
  const cx = size / 2, cy = size / 2;
  const rOut = size * 0.36;
  const n = RADAR_AXES.length;

  function pt(i, r) {
    const a = (i * 2 * Math.PI / n) - Math.PI / 2;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }

  // Grid rings
  let grid = '';
  for (const f of [0.25, 0.5, 0.75, 1.0]) {
    const pts = Array.from({ length: n }, (_, i) => pt(i, rOut * f)).map(p => p.join(',')).join(' ');
    const isOuter = f === 1;
    grid += `<polygon points="${pts}" fill="none" stroke="${isOuter ? '#333648' : '#1e2233'}" stroke-width="${isOuter ? 0.8 : 0.4}"${isOuter ? '' : ' stroke-dasharray="2,2"'}/>`;
  }
  // Spokes
  const spokes = RADAR_AXES.map((_, i) => {
    const [px, py] = pt(i, rOut);
    return `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#1e2233" stroke-width="0.6"/>`;
  }).join('');
  // Data
  const dataPts = RADAR_AXES.map(({ key }, i) => pt(i, rOut * Math.max(0, Math.min(1, buckets[key] ?? 0))));
  const poly = dataPts.map(p => p.join(',')).join(' ');
  const dots = dataPts.map(([dx, dy]) => `<circle cx="${dx}" cy="${dy}" r="1.8" fill="${color}"/>`).join('');
  // Labels
  const labels = showLabels ? RADAR_AXES.map(({ label }, i) => {
    const [lx, ly] = pt(i, rOut + 11);
    return `<text x="${lx}" y="${ly}" font-size="7" fill="#64748b" text-anchor="middle" dominant-baseline="middle" font-family="Inter,sans-serif">${label}</text>`;
  }).join('') : '';

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="overflow:visible;display:block;">
    ${grid}${spokes}
    <polygon points="${poly}" fill="${color}22" stroke="${color}" stroke-width="1.3" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

// ── Radar detail chart for selected token ─────────────────────────────────────

function renderRadarDetailSection(cgId) {
  const cached = radarDetailCache.get(cgId);
  const placeholder = `<div id="detail-radar-section" data-cgid="${cgId}">`;

  if (!cached) return placeholder + `
    <div style="display:flex;align-items:center;gap:10px;padding:12px 0;color:var(--muted);font-size:12px;">
      <span class="spinner-sm"></span><span>Computing radar profile…</span>
    </div></div>`;

  if (cached === 'error') return placeholder + `
    <div style="font-size:12px;color:var(--muted);padding:4px 0;">Radar profile unavailable (no Binance perp data)</div></div>`;

  const { att, price, vol, oi, lev, R } = cached;
  const buckets = { att, price, vol, oi, lev };
  const chart = svgRadarChart(buckets, 140, '#f97316', true);
  const scoreColor = R >= 65 ? '#22c55e' : R >= 45 ? '#f59e0b' : '#ef4444';

  const bars = RADAR_AXES.map(({ key, label }) => {
    const pct = Math.round((buckets[key] ?? 0) * 100);
    const w   = RADAR_W[key];
    const contribution = (pct / 100 * w).toFixed(1);
    const bc  = pct >= 70 ? '#22c55e' : pct >= 40 ? '#f59e0b' : '#ef4444';
    return `
      <div>
        <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
          <span style="font-size:11px;color:var(--muted);font-weight:600;">${label} <span style="color:${bc};font-size:10px;">${pct}%</span></span>
          <span class="mono" style="font-size:10px;color:var(--muted);">+${contribution}/${w}</span>
        </div>
        <div style="height:4px;background:var(--elevated);border-radius:2px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:${bc};border-radius:2px;"></div>
        </div>
      </div>`;
  }).join('');

  return placeholder + `
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <div style="flex-shrink:0;">${chart}</div>
      <div style="flex:1;min-width:160px;">
        <div style="margin-bottom:10px;">
          <span class="mono" style="font-size:26px;font-weight:800;color:${scoreColor};">R=${R}</span>
          <span style="font-size:11px;color:var(--muted);margin-left:6px;">/ 100</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">${bars}</div>
      </div>
    </div>
  </div>`;
}

async function loadDetailRadar(cgId, symbol) {
  if (radarDetailCache.has(cgId)) {
    if (selectedCgId === cgId) _patchDetailRadarSection(cgId);
    return;
  }

  // Resolve Binance perp symbol
  const candidates = [...binancePerpSymbolCandidates(symbol)];
  let perpSym = null;
  for (const c of candidates) {
    try { const d = await fetchBinancePerpCandidate(c); if (d) { perpSym = c; break; } } catch {}
  }
  if (!perpSym) {
    radarDetailCache.set(cgId, 'error');
    if (selectedCgId === cgId) _patchDetailRadarSection(cgId);
    return;
  }
  const spotSym = `${symbol.replace(/[^A-Z0-9]/gi,'').toUpperCase()}USDT`;

  const [oiR, kl1dR, kl1hR, fundR, spotKlR, tkR, btcR, t1hR, t1dR, sentR_] = await Promise.allSettled([
    fetchRadarOIHist(perpSym),
    fetchRadarKlines(perpSym, '1d', 35),
    fetchRadarKlines(perpSym, '1h', 13),
    fetchRadarFundingHist(perpSym),
    fetchRadarSpotKlines(spotSym),
    fetchBinanceAllTicker(),
    fetchBTCRefKlines(),
    fetchApexData('technical', '1h'),
    fetchApexData('technical', '1d'),
    fetchApexData('sentiment'),
  ]);

  const oiHist    = oiR.status    === 'fulfilled' ? oiR.value    : [];
  const klines1d  = kl1dR.status  === 'fulfilled' ? kl1dR.value  : [];
  const klines1h  = kl1hR.status  === 'fulfilled' ? kl1hR.value  : [];
  const funding   = fundR.status  === 'fulfilled' ? fundR.value  : [];
  const spotKlines = spotKlR.status === 'fulfilled' ? spotKlR.value : [];
  const allTk     = tkR.status    === 'fulfilled' ? tkR.value    : [];
  const btcKlines = btcR.status   === 'fulfilled' ? btcR.value   : [];
  const tech1hMap = t1hR.status   === 'fulfilled' ? t1hR.value   : {};
  const tech1dMap = t1dR.status   === 'fulfilled' ? t1dR.value   : {};
  const sentMap   = sentR_.status === 'fulfilled' ? sentR_.value : {};

  const btcCloses = btcKlines.length > 1 ? btcKlines.slice(0,-1).map(k=>parseFloat(k[4])) : [];
  const tkEntry   = allTk.find(t => t.symbol === perpSym);
  const pctRaw    = tkEntry ? parseFloat(tkEntry.priceChangePercent) : NaN;
  const dayChangeFrac = Number.isFinite(pctRaw) ? pctRaw / 100 : null;
  const quoteVol  = tkEntry ? parseFloat(tkEntry.quoteVolume) : NaN;
  const lastFR    = tkEntry ? parseFloat(tkEntry.lastFundingRate ?? NaN) : NaN;
  const markPrice = tkEntry ? parseFloat(tkEntry.lastPrice || 0) : 0;

  const att   = scoreRadarAtt(sentMap[symbol], tech1hMap[symbol], tech1dMap[symbol]);
  const price = scoreRadarPrice(dayChangeFrac, klines1h, klines1d, btcCloses);
  const vol   = scoreRadarVol(quoteVol, klines1d, spotKlines);
  const oi    = scoreRadarOI(oiHist, markPrice, quoteVol);
  const lev   = scoreRadarLev(funding, Number.isFinite(lastFR) ? lastFR : null);
  const R     = computeRadarR({ att, price, vol, oi, lev });

  radarDetailCache.set(cgId, { att, price, vol, oi, lev, R });
  if (selectedCgId === cgId) _patchDetailRadarSection(cgId);
}

function _patchDetailRadarSection(cgId) {
  const el = document.getElementById('detail-radar-section');
  if (!el || el.dataset.cgid !== cgId) return;
  const html = renderRadarDetailSection(cgId);
  // Extract inner content between first > and last </div>
  const wrapper = document.createElement('div');
  wrapper.innerHTML = html;
  const inner = wrapper.querySelector('#detail-radar-section');
  if (inner) el.replaceWith(inner);
}

// ── Radar side-rail orchestration ─────────────────────────────────────────────

async function loadListingRadar(force = false, options = {}) {
  if (radarState.status === 'loading' || radarState.refreshing) return;
  const previousState = radarState;
  const hasDisplay = Array.isArray(previousState.tokens) && previousState.tokens.length > 0;
  const lazy = Boolean(options.lazy && hasDisplay);

  radarState = lazy
    ? { ...previousState, refreshing: true, error: null }
    : { status: 'loading', tokens: [], error: null, loadedAt: previousState.loadedAt || null, refreshing: false };
  refreshSideRail();

  try {
    // Phase 1: all global sources in parallel
    const [cmcR, spotListR, cgMktsR, btcKlR, allTkR, sentR, t1hR, t1dR] = await Promise.allSettled([
      fetchCMCTrending(),
      fetchBinanceSpotList(),
      cgGet('/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=false'),
      fetchBTCRefKlines(),
      fetchBinanceAllTicker(),
      fetchApexData('sentiment'),
      fetchApexData('technical', '1h'),
      fetchApexData('technical', '1d'),
    ]);

    const cmcTrend   = cmcR.status      === 'fulfilled' ? cmcR.value      : [];
    const spotList   = spotListR.status === 'fulfilled' ? spotListR.value : [];
    const cgMkts     = cgMktsR.status   === 'fulfilled' ? cgMktsR.value  : [];
    const btcKlines  = btcKlR.status    === 'fulfilled' ? btcKlR.value   : [];
    const allTk      = allTkR.status    === 'fulfilled' ? allTkR.value   : [];
    const sentMap    = sentR.status     === 'fulfilled' ? sentR.value    : {};
    const tech1hMap  = t1hR.status      === 'fulfilled' ? t1hR.value    : {};
    const tech1dMap  = t1dR.status      === 'fulfilled' ? t1dR.value    : {};

    const btcCloses = btcKlines.length > 1 ? btcKlines.slice(0,-1).map(k => parseFloat(k[4])) : [];

    // ── CMC trending symbols ──────────────────────────────────────────────
    const cmcSyms = new Set(cmcTrend
      .map(item => normRadarSym(item.symbol || item.tokenSymbol || ''))
      .filter(s => s && !isRadarExcluded(s)));
    const cmcRankMap = {};
    cmcTrend.forEach((item, i) => {
      const sym = normRadarSym(item.symbol || item.tokenSymbol || '');
      if (sym) cmcRankMap[sym] = item.listingRank ?? (i + 1);
    });

    // ── Binance spot active sets (top 100 each) ───────────────────────────
    const spotItems = spotList
      .filter(s => !s.legalMoney && s.baseAsset)
      .map(s => ({
        ...s, _base: normRadarSym(s.baseAsset),
        _absDC: Math.abs(parseFloat(s.dayChange || 0)),
        _dc:    parseFloat(s.dayChange || 0),
        _vol:   parseFloat(s.volume || 0),
      }))
      .filter(s => s._base && !isRadarExcluded(s._base));

    const N = 100;
    const topMovers  = new Set([...spotItems].sort((a,b)=>b._absDC-a._absDC).slice(0,N).map(s=>s._base));
    const topGainers = new Set([...spotItems].filter(s=>s._dc>=0).sort((a,b)=>b._dc-a._dc).slice(0,N).map(s=>s._base));
    const topVol     = new Set([...spotItems].filter(s=>s._vol>=1e6).sort((a,b)=>b._vol-a._vol).slice(0,N).map(s=>s._base));

    // ── Futures ticker lookup + futures top-100 ───────────────────────────
    const tickerBySym = {};
    const futAllSet   = new Set();
    for (const t of allTk) {
      const base = normRadarSym(t.symbol);
      futAllSet.add(base);
      if (!tickerBySym[base] || t.symbol.endsWith('USDT')) tickerBySym[base] = t;
    }
    const futTopSyms = new Set(
      [...allTk]
        .map(t => ({ base: normRadarSym(t.symbol), qv: parseFloat(t.quoteVolume || 0) }))
        .filter(t => !isRadarExcluded(t.base))
        .sort((a,b) => b.qv - a.qv).slice(0, N).map(t => t.base)
    );

    // ── MCap lookup (spot list primary, CG markets fallback) ──────────────
    const mcapLookup = {};
    for (const s of spotItems) {
      const mc = parseFloat(s.marketCap || 0);
      if (s._base && mc > 0) mcapLookup[s._base] = mc;
    }
    for (const item of cgMkts) {
      const sym = normRadarSym(item.symbol || '');
      const mc  = parseFloat(item.market_cap || 0);
      if (sym && mc > 0 && !mcapLookup[sym]) mcapLookup[sym] = mc;
    }

    // ── Universe = CMC trending ∩ Binance active sets ─────────────────────
    const binanceSyms = new Set([...topMovers, ...topGainers, ...topVol, ...futTopSyms]);
    let candidates;
    if (cmcSyms.size > 0) {
      candidates = [...cmcSyms].filter(s => binanceSyms.has(s));
    } else {
      // CMC fetch failed — degrade to CG trending ∩ Binance active sets
      const cgCoins = ((await cgGet('/search/trending').catch(()=>({}))).coins || []).map(r=>r.item).filter(Boolean);
      candidates = cgCoins
        .map(item => normRadarSym(item.symbol || ''))
        .filter(s => s && binanceSyms.has(s) && !isRadarExcluded(s));
    }

    // ── Hard gates ────────────────────────────────────────────────────────
    // Gate 1: must have active Binance USD-M futures
    // Gate 2: MCap > $10M
    const MCAP_MIN = 10_000_000;
    const passing = candidates.filter(sym =>
      futAllSet.has(sym) && (mcapLookup[sym] || 0) > MCAP_MIN
    );

    // Spot symbol lookup (for P/S ratio spot klines)
    const spotSymLookup = {};
    for (const s of spotItems) if (s._base) spotSymLookup[s._base] = s.symbol || `${s._base}USDT`;

    // CG identity (thumb, name, cgId) for display
    const cgState = trendingState.tokens || [];
    const cgMeta  = Object.fromEntries(cgState.map(t => [normRadarSym(t.symbol), t]));

    // Build per-candidate metadata
    const candMeta = passing.map(sym => {
      const tk   = tickerBySym[sym];
      const sl   = spotItems.find(s => s._base === sym);
      const cg   = cgMeta[sym];
      return {
        symbol:     sym,
        cgId:       cg?.id || sym.toLowerCase(),
        name:       cg?.name || sl?.fullName || sl?.name || sym,
        thumb:      cg?.thumb || null,
        rank:       cg?.rank  || null,
        perpSym:    tk?.symbol    || `${sym}USDT`,
        spotSym:    spotSymLookup[sym] || `${sym}USDT`,
        // dayChange: priceChangePercent from perp (preferred), spot dayChange fallback
        dayChangePct: parseFloat(tk?.priceChangePercent ?? sl?.dayChange ?? NaN),
        quoteVol24h:  parseFloat(tk?.quoteVolume   || 0),
        lastPrice:    parseFloat(tk?.lastPrice      || 0),
        lastFR:       parseFloat(tk?.lastFundingRate ?? NaN),
        marketCap:    mcapLookup[sym] || null,
        alreadyListed: riseMarketsState.markets.some(m => m.symbol === sym),
      };
    });

    if (!candMeta.length) {
      radarState = { status: 'loaded', tokens: [], error: null, loadedAt: Date.now(), refreshing: false };
      refreshSideRail();
      return;
    }

    // ── Phase 2: per-symbol fetches (4-wide concurrency) ─────────────────
    const scored = [];
    const CONC = 4;
    for (let i = 0; i < candMeta.length; i += CONC) {
      const batch = candMeta.slice(i, i + CONC);
      const results = await Promise.allSettled(batch.map(async t => {
        const [oiR, kl1dR, kl1hR, fundR, spotKlR] = await Promise.allSettled([
          fetchRadarOIHist(t.perpSym),
          fetchRadarKlines(t.perpSym, '1d', 35),
          fetchRadarKlines(t.perpSym, '1h', 13),
          fetchRadarFundingHist(t.perpSym),
          fetchRadarSpotKlines(t.spotSym),
        ]);
        const oiHist    = oiR.status    === 'fulfilled' ? oiR.value    : [];
        const klines1d  = kl1dR.status  === 'fulfilled' ? kl1dR.value  : [];
        const klines1h  = kl1hR.status  === 'fulfilled' ? kl1hR.value  : [];
        const funding   = fundR.status  === 'fulfilled' ? fundR.value  : [];
        const spotKlines = spotKlR.status === 'fulfilled' ? spotKlR.value : [];

        // dayChange fraction: priceChangePercent is already a % string (e.g. "+20.43") → /100
        const dayChangeFrac = Number.isFinite(t.dayChangePct) ? t.dayChangePct / 100 : null;

        const attD   = scoreRadarAttDetail(sentMap[t.symbol], tech1hMap[t.symbol], tech1dMap[t.symbol]);
        const priceD = scoreRadarPriceDetail(dayChangeFrac, klines1h, klines1d, btcCloses);
        const volD   = scoreRadarVolDetail(t.quoteVol24h, klines1d, spotKlines);
        const oiD    = scoreRadarOIDetail(oiHist, t.lastPrice, t.quoteVol24h);
        const levD   = scoreRadarLevDetail(funding, Number.isFinite(t.lastFR) ? t.lastFR : null);
        const att   = attD.score;
        const price = priceD.score;
        const vol   = volD.score;
        const oi    = oiD.score;
        const lev   = levD.score;
        const R     = computeRadarR({ att, price, vol, oi, lev });

        const lastOICoins = oiHist.length ? parseFloat(oiHist[oiHist.length-1]?.sumOpenInterest || 0) : 0;
        const oiUsd = lastOICoins * t.lastPrice;
        return {
          ...t, att, price, vol, oi, lev, R,
          subs: { att: attD.subs, price: priceD.subs, vol: volD.subs, oi: oiD.subs, lev: levD.subs },
          pct24h: t.dayChangePct, vol24h: t.quoteVol24h, oiUsd,
        };
      }));
      for (const r of results) if (r.status === 'fulfilled') scored.push(r.value);
    }

    scored.sort((a, b) => b.R - a.R);
    radarDisplayCount = RADAR_INITIAL_DISPLAY_COUNT;
    radarState = { status: 'loaded', tokens: scored, error: null, loadedAt: Date.now(), refreshing: false };
    rerenderSelectedRadarAnalysis();
  } catch (err) {
    radarState = lazy
      ? { ...previousState, refreshing: false, error: null }
      : { status: 'error', tokens: [], error: errMsg(err), loadedAt: null, refreshing: false };
  }
  refreshSideRail();
}

function retryListingRadar() { loadListingRadar(true, { lazy: true }); }
function radarLoadMore() {
  radarDisplayCount = Math.min(radarDisplayCount + 10, RADAR_MAX_DISPLAY_COUNT);
  refreshSideRail();
}

function scheduleListingRadarRefresh() {
  if (radarRefreshTimer) clearTimeout(radarRefreshTimer);
  radarRefreshTimer = setTimeout(runListingRadarRefresh, RADAR_REFRESH_MS);
}

async function runListingRadarRefresh() {
  try {
    await loadListingRadar(true, { lazy: true });
  } finally {
    scheduleListingRadarRefresh();
  }
}

function renderRadarAnalysis(t) {
  selectedRadarSymbol = t.symbol;

  const panel = document.getElementById('detail-panel');

  const Rcolor = radarScoreColor(t.R);
  const buckets = { att: t.att, price: t.price, vol: t.vol, oi: t.oi, lev: t.lev };

function openRadarAnalysis(symbol) {
  const t = findRadarToken(symbol);
  if (t) renderRadarAnalysis(t);
}

function rerenderSelectedRadarAnalysis() {
  if (!selectedRadarSymbol) return;
  const t = findRadarToken(selectedRadarSymbol);
  if (t) renderRadarAnalysis(t);
}

function toggleBucketInline(row) {
  const sub = row.nextElementSibling;
  const chevron = row.querySelector('.bucket-chevron');
  if (!sub) return;
  const open = sub.style.display !== 'none';
  sub.style.display = open ? 'none' : 'block';
  if (chevron) chevron.style.transform = open ? '' : 'rotate(90deg)';
}

let expandedRadarSymbol = null;

function toggleRadarToken(symbol) {
  expandedRadarSymbol = expandedRadarSymbol === symbol ? null : symbol;
  refreshSideRail();
}

let _searchTimer = null;
document.getElementById('search-input').addEventListener('input', e => {
  const q = e.target.value.trim();
  clearTimeout(_searchTimer);
  if (!q) {
    searchMode = false;
    searchResults = [];
    renderTokenList();
    return;
  }
  searchMode = true;
  document.getElementById('search-spinner').style.display = 'block';
  _searchTimer = setTimeout(async () => {
    try {
      const data = await cgGet(`/search?query=${encodeURIComponent(q)}`);
      searchResults = (data.coins || []).slice(0, 10).map(c => {
        const sym = c.symbol.toUpperCase();
        const known = KNOWN[sym];
        return {
          symbol: sym, cgId: c.id, cmcId: known?.cmcId || CMC_IDS_BY_SYMBOL[sym],
          name: c.name,
          rank: c.market_cap_rank || null, thumb: c.thumb || null,
          safetyScore: known?.safetyScore || 75,
          feedGrade:   known?.feedGrade   || 'A',
        };
      });
    } catch { searchResults = []; }
    document.getElementById('search-spinner').style.display = 'none';
    renderTokenList();
  }, 400);
});

// ─── FORMAT HELPERS ───────────────────────────────────────────────────────────
function fmtPrice(p) {
  if (!p) return '—';
  if (p >= 1000)  return '$' + p.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (p >= 1)     return '$' + p.toFixed(2);
  if (p >= 0.01)  return '$' + p.toFixed(3);
  return '$' + p.toFixed(5);
}
function fmtUsdPrecise(n) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '—';
  if (n >= 1) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  if (n >= 0.01) return '$' + n.toFixed(4);
  if (n >= 0.0001) return '$' + n.toFixed(6);
  return '$' + n.toExponential(2);
}
function fmtBig(n) {
  if (!n) return '$0';
  if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6)  return '$' + (n / 1e6).toFixed(0) + 'M';
  if (n >= 1e3)  return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
}
function fmtPct(v) {
  if (!v) return '0.00%';
  return (v * 100).toFixed(2) + '%';
}
function fmtQty(n, suffix = '') {
  if (n === null || n === undefined || !Number.isFinite(n)) return '—';
  const abs = Math.abs(n);
  const body = abs >= 1e9 ? (n / 1e9).toFixed(2) + 'B'
    : abs >= 1e6 ? (n / 1e6).toFixed(1) + 'M'
    : abs >= 1e3 ? (n / 1e3).toFixed(1) + 'K'
    : abs >= 10 ? n.toFixed(0)
    : abs >= 1 ? n.toFixed(2)
    : n.toFixed(4);
  return suffix ? `${body} ${suffix}` : body;
}
function fmtFunding(v) {
  if (v === null || v === undefined || !Number.isFinite(v)) return '—';
  return (v * 100).toFixed(4) + '%';
}
function fmtPlainInt(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'bigint') return v.toString();
  if (!Number.isFinite(v)) return '—';
  return Math.round(v).toLocaleString('en-US');
}
function fmtFactorExpr(v) {
  if (v === null || v === undefined) return '—';
  let n = typeof v === 'bigint' ? v : BigInt(Math.round(v));
  if (n === 0n) return '0';
  const oneE18 = 1000000000000000000n;
  if (n % oneE18 === 0n) return `${(n / oneE18).toString()} * 1e18`;
  let exp = 0;
  while (n % 10n === 0n) {
    n /= 10n;
    exp++;
  }
  return exp ? `${n.toString()} * 1e${exp}` : n.toString();
}
function fmtDecimal(v) {
  if (v === null || v === undefined || !Number.isFinite(v)) return '—';
  const abs = Math.abs(v);
  if (abs >= 1000) return v.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (abs >= 1) return String(Number(v.toFixed(8)));
  return v.toFixed(Math.min(12, Math.max(0, Math.ceil(-Math.log10(abs || 1)) + 2))).replace(/0+$/, '').replace(/\.$/, '');
}
function fmtConfigPct(v) {
  return v === null || v === undefined || !Number.isFinite(v) ? '—' : (v * 100).toFixed(2) + '%';
}
function fmtBps(v) {
  return v === null || v === undefined || !Number.isFinite(v) ? '—' : (v * 10000).toFixed(2) + ' bps';
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}
function jsStr(v) {
  return JSON.stringify(String(v ?? ''));
}

function moneyToUsd(s) {
  const raw = String(s || '').trim().replace(/[$,\s]/g, '').toUpperCase();
  if (!raw || raw === '—') return null;
  const mult = raw.endsWith('B') ? 1e9 : raw.endsWith('M') ? 1e6 : raw.endsWith('K') ? 1e3 : 1;
  const n = Number(raw.replace(/[BMK]$/, ''));
  return Number.isFinite(n) ? n * mult : null;
}

function tierInputId(tier) {

function tierThresholdMap() {
  return Object.fromEntries(TIER_NAMES.map(name => {
    const row = CFG.TIERS.find(([, tier]) => tier === name);
    return [name, row ? row[0] : 0];
  }));
}

function tierRuleText() {
  const byTier = tierThresholdMap();
  return TIER_NAMES.map(t => `${t} >= ${fmtDecimal(byTier[t])}`).join(', ') + '.';
}

function normalizePositiveNumber(value, fallback, min = 0) {
  const n = Number(value);
  return Number.isFinite(n) && n >= min ? n : fallback;
}

function moneyInputToDisplay(value, fallback) {
  const raw = String(value ?? '').trim();
  const n = moneyToUsd(raw);
  if (!(n > 0)) return fallback;
  return fmtBig(n);
}

function tierParamsPayload() {
  return Object.fromEntries(TIER_NAMES.map(tier => [tier, { ...CFG.TIER_PARAMS[tier] }]));
}

function applySettingsPayload(payload) {
  const refs = payload?.refs || {};
  CFG.REFS = {
    depth:  normalizePositiveNumber(refs.depth,  CFG.REFS.depth,  0.000001),
    vol:    normalizePositiveNumber(refs.vol,    CFG.REFS.vol,    0.000001),
    es95:   normalizePositiveNumber(refs.es95,   CFG.REFS.es95,   0.000001),
    volume: normalizePositiveNumber(refs.volume, CFG.REFS.volume, 0.000001),
    conc:   normalizePositiveNumber(refs.conc,   CFG.REFS.conc,   0.000001),
    spread: normalizePositiveNumber(refs.spread, CFG.REFS.spread, 0.000001),
  };

  const nextTiers = payload?.tiers || {};
  const tierFallbacks = tierThresholdMap();
  CFG.TIERS = TIER_NAMES
    .map(name => [normalizePositiveNumber(nextTiers[name], tierFallbacks[name], 0), name])
    .sort((a, b) => b[0] - a[0]);
  CFG.TIERS.push([0, 'Rejected']);

  const nextTierParams = payload?.tierParams || {};
  for (const tier of TIER_NAMES) {
    const current = CFG.TIER_PARAMS[tier];
    const incoming = nextTierParams[tier] || {};
    const maxLev = normalizePositiveNumber(incoming.maxLev, Number(current.maxLev), 0.000001);
    const imrPct = (1 / maxLev) * 100;
    const mmrPct = (2 / 3) * imrPct;
    const cmrPct = (2 / 3) * mmrPct;
    CFG.TIER_PARAMS[tier] = {
      maxLev,
      imr: fmtConfigPct(imrPct / 100),
      mmr: fmtConfigPct(mmrPct / 100),
      cmr: fmtConfigPct(cmrPct / 100),
      oiLo: moneyInputToDisplay(incoming.oiLo, current.oiLo),
      oiHi: moneyInputToDisplay(incoming.oiHi, current.oiHi),
    };
  }

  CFG.EXPECTED_MIN_ORDER_USD = normalizePositiveNumber(
    payload?.expectedMinOrderUsd,
    CFG.EXPECTED_MIN_ORDER_USD,
    0.000001
  );
}

function currentSettingsPayload() {
  return {
    refs: { ...CFG.REFS },
    tiers: tierThresholdMap(),
    tierParams: tierParamsPayload(),
    expectedMinOrderUsd: CFG.EXPECTED_MIN_ORDER_USD,
  };
}

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(currentSettingsPayload()));
  } catch {}
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
    if (raw) applySettingsPayload(JSON.parse(raw));
  } catch {}
}

function recomputeResultScores(r) {
  if (!r?.metrics) return r;
  const m = r.metrics;
  const scores = {
    depth:  scoreMetric(m.depth?.val,  CFG.REFS.depth,  CFG.WEIGHTS.depth,  false),
    vol:    scoreMetric(m.vol?.val,    CFG.REFS.vol,    CFG.WEIGHTS.vol,    true,  CFG.VMAXES.vol),
    es95:   scoreMetric(m.es95?.val,   CFG.REFS.es95,   CFG.WEIGHTS.es95,   true,  CFG.VMAXES.es95),
    volume: scoreMetric(m.volume?.val, CFG.REFS.volume, CFG.WEIGHTS.volume, false),
    conc:   scoreMetric(m.conc?.val,   CFG.REFS.conc,   CFG.WEIGHTS.conc,   false),
    spread: scoreMetric(m.spread?.val, CFG.REFS.spread, CFG.WEIGHTS.spread, true),
  };
  for (const [key, score] of Object.entries(scores)) {
    if (m[key]) {
      m[key].score = score;
      m[key].w = CFG.WEIGHTS[key];
    }
  }
  r.totalScore = Math.round(Object.values(scores).reduce((sum, v) => sum + v, 0) * 10) / 10;
  r.rawTier = r.allPass ? scoreToTier(r.totalScore) : 'Rejected';
  r.finalTier = r.allPass ? computeFinalTier(r.symbol, r.rawTier, r.feedGrade, r.ageDays) : 'Rejected';
  r.tierP = CFG.TIER_PARAMS[r.finalTier] || CFG.TIER_PARAMS['Rejected'];
  r.whitelistCap = r.rawTier === 'Prime' && !CFG.PRIME_WHITELIST.has(r.symbol);
  r.ageCapped = r.ageDays < CFG.AGE_MIN_DAYS;
  return r;
}

function cappedPower10ForNotional(price, maxUsd) {
  if (!(price > 0) || !(maxUsd > 0)) return { value: null, exp: null };
  const exp = Math.floor(Math.log10(maxUsd / price));
  return { value: 10 ** exp, exp };
}

function cappedPower10(target) {
  if (!(target > 0)) return { value: null, exp: null };
  const exp = Math.floor(Math.log10(target));
  return { value: 10 ** exp, exp };
}

function suggestedStepPrice(price) {
  if (!(price > 0)) return { value: null, exp: null };
  if (price >= 10000) return { value: 0.1, exp: -1 };
  if (price >= 1000) return { value: 0.01, exp: -2 };
  const hardcap = cappedPower10(price * 0.0001);
  if (price >= 100) {
    const v = hardcap.value === null ? null : Math.min(hardcap.value, 0.01);
    return { value: v, exp: v === 0.01 ? -2 : hardcap.exp };
  }
  return hardcap;
}

function roundToMultiple(value, multiple, minValue = multiple) {
  if (!(value > 0) || !(multiple > 0)) return minValue;
  return Math.max(minValue, Math.round(value / multiple) * multiple);
}

function oiLimitStepRound(value) {
  return value && value < 500000 ? 50000 : 500000;
}

function tierParams(tier) {
  return CFG.TIER_PARAMS[tier] || CFG.TIER_PARAMS['Rejected'];
}

function pctStringToFraction(value) {
  const n = Number(String(value ?? '').replace('%', '').trim());
  return Number.isFinite(n) ? n / 100 : null;
}

const ONE_E18 = 1000000000000000000n;
function mmFactorFromMaxLev(maxLev) {
  const n = Number(maxLev);
  if (!(n > 0)) return null;
  if (Number.isInteger(n) && n <= Number.MAX_SAFE_INTEGER) {
    return (BigInt(n) * 3n * ONE_E18) / 2n;
  }
  return BigInt(Math.round((3 * n / 2) * 1e18));
}

function computeSuggestedConfig(r, tier = r?.finalTier) {
  const tierP = tierParams(tier);
  const maxLev = Number(tierP?.maxLev);
  const price = Number(r?.price);
  if (!(maxLev > 0) || !(price > 0)) return null;

  const imr = 1 / maxLev;
  const mmr = (2 / 3) * imr;
  const mmFactor = mmFactorFromMaxLev(maxLev);
  const stepPrice = suggestedStepPrice(price);
  const stepSize = cappedPower10ForNotional(price, STEP_SIZE_MAX_USD);
  const stepNotional = stepSize.value ? stepSize.value * price : null;
  const minOrderStep = stepNotional ? roundToMultiple(CFG.EXPECTED_MIN_ORDER_USD / stepNotional, 5, 5) : null;
  const oiLowerUsd = moneyToUsd(tierP?.oiLo);
  const oiLimitRaw = oiLowerUsd && stepNotional ? oiLowerUsd / stepNotional : null;
  const oiRound = oiLimitStepRound(oiLimitRaw);
  const oiLimitSteps = oiLimitRaw ? roundToMultiple(oiLimitRaw, oiRound, oiRound) : null;

  return {
    maxLev,
    imr,
    mmr,
    mmFactor,
    stepPrice: stepPrice.value,
    stepSize: stepSize.value,
    minOrderStep,
    oiLimitSteps,
    maxOrderStep: oiLimitSteps ? Math.round(oiLimitSteps / 10) : null,
    priceBand: 0.05,
    impactNotional: 50,
    minOrderUsd: minOrderStep && stepNotional ? minOrderStep * stepNotional : null,
    oiLimitUsd: oiLimitSteps && stepNotional ? oiLimitSteps * stepNotional : null,
    tier,
    tierP,
  };
}

function mdCell(v) {
  return String(v ?? '—').replace(/\|/g, '\\|').replace(/\n+/g, ' ').trim() || '—';
}

function mdTable(headers, rows) {
  return [
    `| ${headers.map(mdCell).join(' | ')} |`,
    `| ${headers.map(() => '---').join(' | ')} |`,
    ...rows.map(row => `| ${row.map(mdCell).join(' | ')} |`),

}

function exchangeReferenceRows(r) {
  const sym = refSymbol(r?.symbol);
  const st = exchangeRefCache.get(sym);
  const order = [
    ['binance', 'Binance'],
    ['hyperliquid', 'Hyperliquid'],
    ['aster', 'Aster'],
    ['lighter', 'Lighter'],
  ];
  return order.map(([key, label]) => {
    const ref = st?.refs?.[key] || { status: 'loading' };
    const d = ref.data || {};
    if (ref.status === 'error') {
      return {
        venue: label, market: '—', status: 'ERR', maxLev: '—', stepSize: '—',
        stepPrice: '—', imr: '—', mmr: '—', cmr: '—', limit: ref.error || 'Unavailable',
      };
    }
    if (ref.status === 'loading') {
      return {
        venue: label, market: '—', status: 'LOADING', maxLev: '—', stepSize: '—',
        stepPrice: '—', imr: '—', mmr: '—', cmr: '—', limit: 'Fetching live settings',
      };
    }
    if (!d.listed) {
      return {
        venue: label, market: 'Not listed', status: 'NOT LISTED', maxLev: '—', stepSize: '—',
        stepPrice: '—', imr: '—', mmr: '—', cmr: '—', limit: d.note || 'No perp market found',
      };
    }
    return {
      venue: label,
      market: `${d.market || sym} perp`,
      status: exchangeStatusLabel(d.status),
      maxLev: d.maxLev ? `${d.maxLev}x` : '—',
      stepSize: fmtDecimal(d.stepSize),
      stepPrice: fmtDecimal(d.stepPrice),
      imr: marginPct(d.imr),
      mmr: marginPct(d.mmr),
      cmr: marginPct(d.cmr),
      limit: d.limit || '—',
    };
  });
}

function downloadTextFile(filename, content, type = 'text/plain') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportResult(format) {
  const r = selectedCgId ? resultCache.get(selectedCgId) : null;
  if (!r) {
    alert('No completed token assessment is available to export yet.');
    return;
  }
  if (format === 'markdown') {
    downloadTextFile(`${reportFileBase(r)}.md`, buildMarkdownReport(r), 'text/markdown;charset=utf-8');
    return;
  }
  if (format === 'pdf') {
    const w = window.open('', '_blank');
    if (!w) {
      alert('Allow pop-ups to open the print-ready PDF report.');
      return;
    }
    w.document.open();
    w.document.write(buildPdfReportHtml(r));
    w.document.close();
    w.focus();
    setTimeout(() => w.print(), 300);
  }
}

function finalTierForRawOption(r, rawTier) {
  if (!r?.allPass || rawTier === 'Rejected') return 'Rejected';
  return computeFinalTier(r.symbol, rawTier, r.feedGrade, r.ageDays);
}

function suggestedTierOptions(r) {
  if (!r?.allPass) return [];
  const options = new Set([r.finalTier]);
  const score = Number(r.totalScore);
  if (!Number.isFinite(score)) return [...options].filter(t => t && t !== 'Rejected');

  const boundaries = CFG.TIERS
    .filter(([, tier]) => tier !== 'Rejected')
    .map(([threshold, upperTier], i) => ({
      threshold,
      upperTier,
      lowerTier: CFG.TIERS[i + 1]?.[1],
    }))
    .filter(b => b.lowerTier);

  for (const b of boundaries) {
    if (Math.abs(score - b.threshold) <= b.threshold * 0.10) {
      options.add(finalTierForRawOption(r, b.upperTier));
      options.add(finalTierForRawOption(r, b.lowerTier));
    }
  }

  const rest = [...options]
    .filter(t => t && t !== 'Rejected' && t !== r.finalTier)
    .sort((a, b) => CFG.TIER_ORDER.indexOf(a) - CFG.TIER_ORDER.indexOf(b));
  return [r.finalTier, ...rest].filter(t => t && t !== 'Rejected');
}

function tierClass(tier) {
  const m = { Prime:'tier-prime', Major:'tier-major', 'Mid-Cap':'tier-midcap',
              'Small-Cap':'tier-smallcap', 'Micro-Cap':'tier-microcap' };
  return m[tier] || 'tier-rejected';
}
function tierColor(tier) {
  const m = { Prime:'#f97316', Major:'#60a5fa', 'Mid-Cap':'#c084fc',
              'Small-Cap':'#f59e0b', 'Micro-Cap':'#d97706' };
  return m[tier] || '#ef4444';
}
function scoreColor(s) {
  if (s >= 90) return '#f97316';
  if (s >= 75) return '#60a5fa';
  if (s >= 60) return '#c084fc';
  if (s >= 45) return '#f59e0b';
  if (s >= 25) return '#d97706';
  return '#ef4444';
}
function avatarColor(sym) {
  const pal = ['#f97316','#60a5fa','#a78bfa','#34d399','#f472b6','#fbbf24','#fb7185','#38bdf8'];
  let h = 0;
  for (let i = 0; i < sym.length; i++) h = (h * 31 + sym.charCodeAt(i)) & 0xffff;
  return pal[h % pal.length];
}
function gateIcon(key) {
  const m = {
    fdmc:    `<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
    binance: `<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>`,
    safety:  `<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>`,
    feed:    `<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>`,
  };
  return m[key] || '';
}
function gateLabel(key) {
  return { fdmc:'FDMC Gate', binance:'Binance Perps', safety:'Safety Score', feed:'Price Feed' }[key] || key;
}

// Renders detail panel with whatever data is available; nulls show spinners.
// State shape:
//   .symbol, .safetyScore, .feedGrade  — always set
//   .detail  — null | { name, price, fdmc, mcap, rank, thumb }       (after step 0)
//   .tickers — null | { allTickers, cgDepth,                         (after tickers)
//   .binance — null | { pass, value }                                (after Binance futures)
//                        depthVal, spreadVal, concVal, exchanges }
//   .ohlc    — null | { parkRes }                                    (after ohlc)
//   .chart   — null | { es95Res, volVal }                            (after chart)
//   .hl      — null | { hlDepth }                                    (after HL)

  // Guard: ignore stale updates from a previous selection
  if (st.cgId !== selectedCgId) return;

  const panel = document.getElementById('detail-panel');
  const { symbol, safetyScore, feedGrade } = st;
  const d  = st.detail;
  const tk = st.tickers;
  const ok = st.ohlc;
  const ck = st.chart;
  const hk = st.hl;
  const errs = st.errors || {};

  const color = avatarColor(symbol);
  const ld = `<span class="spinner-sm"></span>`;
  const fail = msg => `<span style="font-size:11px;font-weight:700;color:var(--red);">${msg || 'Unavailable'}</span>`;
  const metricErr = key => {
    if (key === 'depth' || key === 'conc' || key === 'spread') return errs.tickers;
    if (key === 'vol') return errs.ohlc;
    if (key === 'es95' || key === 'volume') return errs.chart;
    return null;
  };
  let html = '';

  // ── Header ──────────────────────────────────────────────────────────────────
  const name  = d?.name  || symbol;
  const price = d?.price ?? null;
  const fdmc  = d?.fdmc  ?? null;
  const mcap  = d?.mcap  ?? null;
  const rank  = d?.rank  ?? null;
  const thumb = d?.thumb ?? null;

  const avatar = thumb
    ? `<img src="${thumb}" style="width:52px;height:52px;border-radius:14px;object-fit:cover;border:1.5px solid ${color}50;" onerror="this.style.display='none'" />`

  html += `

  // ── Gates ───────────────────────────────────────────────────────────────────

  const safetyCond_ = !safetyPass_ && safetyScore >= CFG.SAFETY_COND_MIN;

    fdmc:    fdmcPass_===null ? (errs.detail ? { error: errs.detail } : 'loading') : { pass: fdmcPass_,  value: fmtBig(fdmc) + (fdmcPass_ ? ' ≥ $100M' : ' < $100M') },

    safety:  { pass: safetyPass_||safetyCond_, cond: safetyCond_, value: `Score: ${safetyScore}/100${safetyCond_ ? ' (conditional, 14d pre-listing)' : ''}` },
    feed:    { pass: feedPass_, value: `Feed Grade: ${feedGrade}` },

  const scoreBlocked = st.complete && (!d || !tk || !ok || !ck);

  html += `
    <div style="margin-bottom:24px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">

        <h2 style="font-size:14px;font-weight:700;color:var(--text);margin:0;">LISTING GATES</h2>
        <span style="font-size:11px;color:var(--muted);">All must pass</span>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">

  // ── Score placeholder ────────────────────────────────────────────────────────
  html += `

// ─── RENDER: RISEx markets ───────────────────────────────────────────────────
function numOrNull(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function normalizeRiseMarket(m) {
  const displayName = m.display_name || m.config?.name || m.underlying || m.base_asset_symbol || '';
  if (!displayName || /\bdeprecated\b/i.test(displayName) || m.visible === false) return null;

  const symbol = String(displayName).split('/')[0].replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  if (!symbol) return null;
  const markPrice = numOrNull(m.mark_price) ?? numOrNull(m.index_price) ?? numOrNull(m.last_price);
  const lastPrice = numOrNull(m.last_price);
  const change24h = numOrNull(m.change_24h);
  const prevPrice = lastPrice !== null && change24h !== null ? lastPrice - change24h : null;
  const changePct24h = prevPrice && prevPrice > 0 && change24h !== null ? change24h / prevPrice : null;
  const openInterest = numOrNull(m.open_interest);
  const oiLimit = numOrNull(m.config?.open_interest_limit);
  const stepSize = numOrNull(m.config?.step_size);
  const stepPrice = numOrNull(m.config?.step_price);
  const maxLeverage = numOrNull(m.config?.max_leverage);
  const mmFactor = numOrNull(m.config?.maintenance_margin_factor);
  const minOrderSize = numOrNull(m.config?.min_order_size);

  return {
    id: m.market_id,
    symbol,
    name: displayName,
    quote: m.quote_asset_symbol || 'USDC',
    status: m.post_only ? 'POST ONLY' : (m.available ? 'LIVE' : 'OFFLINE'),
    postOnly: Boolean(m.post_only),
    available: Boolean(m.available),
    markPrice,
    lastPrice,
    change24h,
    changePct24h,
    volume24h: numOrNull(m.quote_volume_24h),
    openInterest,
    openInterestUsd: openInterest !== null && markPrice !== null ? openInterest * markPrice : null,
    oiLimit,
    oiLimitUsd: oiLimit !== null && markPrice !== null ? oiLimit * markPrice : null,
    maxLeverage,
    stepSize,
    stepPrice,
    mmFactor,
    minOrderSize,
    minOrderStep: minOrderSize !== null && stepSize ? minOrderSize / stepSize : null,
    oiLimitSteps: oiLimit !== null && stepSize ? oiLimit / stepSize : null,
    config: m.config || {},
    funding8h: numOrNull(m.funding_rate_8h),
    canScreen: Boolean(KNOWN[symbol]),
  };
}

async function fetchRiseMarkets() {
  let lastErr = null;
  for (const src of RISE_MARKET_SOURCES) {
    try {
      const r = await fetchWithTimeout(src.url, {}, src.timeoutMs);
      if (!r.ok) {
        lastErr = new Error(`${src.name} ${r.status}`);
        continue;
      }
      const data = await src.parse(r);
      const markets = data?.data?.markets;
      if (!Array.isArray(markets)) {
        lastErr = new Error(`${src.name}: empty markets`);
        continue;
      }
      return { markets, cachedAt: data?.data?.cached_at || null };
    } catch (err) {
      lastErr = new Error(`${src.name}: ${errMsg(err)}`);
    }
  }
  throw lastErr || new Error('RISEx markets unavailable');
}

function refreshRiseMarketsSection() {
  const el = document.getElementById('rise-markets-section');
  if (el) el.innerHTML = renderRiseMarketsSection();
  refreshSideRail();
}

async function loadRiseMarkets(force = false) {
  if (riseMarketsState.status === 'loading') return;
  if (!force && riseMarketsState.status === 'loaded') return;

  riseMarketsState = { ...riseMarketsState, status: 'loading', error: null };
  refreshRiseMarketsSection();
  try {
    const data = await fetchRiseMarkets();
    const markets = data.markets
      .map(normalizeRiseMarket)
      .filter(Boolean)
      .sort((a, b) => {
        if (a.postOnly !== b.postOnly) return a.postOnly ? 1 : -1;
        return Number(a.id) - Number(b.id);
      });
    riseMarketsState = { status: 'loaded', markets, error: null, cachedAt: data.cachedAt };
    updateSyncStamp();
  } catch (err) {
    riseMarketsState = { status: 'error', markets: [], error: errMsg(err), cachedAt: null };
  }
  refreshRiseMarketsSection();
}

function retryRiseMarkets() {
  loadRiseMarkets(true);
}

function toggleRiseMarketDetails(id) {
  const key = String(id || '');
  expandedRiseMarketId = expandedRiseMarketId === key ? null : key;

function screenRiseMarket(symbol) {
  const sym = String(symbol || '').toUpperCase();
  const found = tokenList.find(t => t.symbol === sym);
  const known = KNOWN[sym];
  const t = found || (known ? {
    symbol: sym,
    cgId: known.cgId,
    cmcId: known.cmcId || CMC_IDS_BY_SYMBOL[sym] || null,
    safetyScore: known.safetyScore,
    feedGrade: known.feedGrade,
  } : null);
  if (!t) return;
  selectToken(t.cgId, t.symbol, t.safetyScore, t.feedGrade, t.cmcId || CMC_IDS_BY_SYMBOL[sym] || null);
}

}

function syncStampText(date = new Date()) {
  const pad = n => String(n).padStart(2, '0');
  return `${date.getUTCFullYear()}-${pad(date.getUTCMonth()+1)}-${pad(date.getUTCDate())} ${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())}:${pad(date.getUTCSeconds())} UTC`;
}

function updateSyncStamp(date = new Date()) {
  const el = document.getElementById('sync-stamp');
  if (el) el.textContent = 'LAST SYNC: ' + syncStampText(date);
}

function setAutoRefreshBusy(busy) {
  autoRefreshBusy = busy;
  const btn = document.getElementById('auto-refresh-btn');
  if (!btn) return;
  btn.disabled = busy;
  btn.classList.toggle('refreshing', busy);
}

function scheduleAutoRefresh() {
  if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
  autoRefreshTimer = setTimeout(runAutoRefresh, AUTO_REFRESH_MS);
}

async function runAutoRefresh() {
  if (autoRefreshBusy) {
    scheduleAutoRefresh();
    return;
  }
  setAutoRefreshBusy(true);
  try {
    await loadRiseMarkets(true);
  } finally {
    setAutoRefreshBusy(false);
    scheduleAutoRefresh();
  }
}

function manualAutoRefresh() {
  if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
  runAutoRefresh();
}

async function loadTrendingTokens(force = false) {

  refreshSideRail();
  try {
    const data = await cgGet('/search/trending');
    const tokens = (data?.coins || []).map(row => row.item).filter(Boolean).slice(0, 8).map(item => ({
      id: item.id,

  } catch (err) {

              <div class="mono" style="font-size:12px;font-weight:800;color:var(--orange);text-align:right;">${m.maxLeverage ? m.maxLeverage + 'x' : '—'}</div>
            </div>`;
        }).join('')}
      </div>

function renderSuggestedListingConfig(r, sc) {
  const configs = suggestedTierOptions(r)
    .map(tier => computeSuggestedConfig(r, tier))
    .filter(Boolean);
  if (!configs.length) return '';

  const renderOption = (cfg) => {
    const color = tierColor(cfg.tier);
    const isRecommended = cfg.tier === r.finalTier;
    const top = [
      ['MaxLeverage', `${cfg.maxLev}x`, color],
      ['IMR', fmtConfigPct(cfg.imr), 'var(--text)'],
      ['MMR', fmtConfigPct(cfg.mmr), 'var(--text)'],
      ['mmFactor', fmtFactorExpr(cfg.mmFactor), '#a5b4fc'],
    ];
    const rows = [
      ['StepPrice', fmtDecimal(cfg.stepPrice), `${fmtBps(cfg.stepPrice / r.price)} per tick`],
      ['StepSize', fmtDecimal(cfg.stepSize), `≈ ${fmtUsdPrecise(cfg.stepSize * r.price)} per step`],
      ['MinOrderStep', fmtPlainInt(cfg.minOrderStep), cfg.minOrderUsd ? `≈ ${fmtBig(cfg.minOrderUsd)}` : `≈ ${fmtBig(CFG.EXPECTED_MIN_ORDER_USD)}`],
      ['OILimitSteps', fmtPlainInt(cfg.oiLimitSteps), cfg.oiLimitUsd ? `≈ ${fmtBig(cfg.oiLimitUsd)} lower OI` : `≈ ${cfg.tierP.oiLo}`],
      ['MaxOrderStep', fmtPlainInt(cfg.maxOrderStep), cfg.oiLimitUsd ? `≈ ${fmtBig(cfg.oiLimitUsd / 10)}` : 'OILimitSteps / 10'],
      ['PriceBand', fmtConfigPct(cfg.priceBand), ''],
      ['ImpactNotional', fmtBig(cfg.impactNotional), ''],
    ];

    return `
      <div style="background:var(--surface);border:1px solid ${isRecommended ? 'rgba(249,115,22,0.55)' : 'var(--border)'};border-radius:12px;overflow:hidden;box-shadow:${isRecommended ? '0 0 0 1px rgba(249,115,22,0.16)' : 'none'};">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="${tierClass(cfg.tier)}" style="font-size:11px;font-weight:800;letter-spacing:0.4px;padding:4px 10px;border-radius:6px;">${cfg.tier} Option</span>
            ${isRecommended ? `<span style="font-size:10px;font-weight:800;color:var(--orange);background:rgba(249,115,22,0.10);border:1px solid rgba(249,115,22,0.28);border-radius:5px;padding:3px 7px;">RECOMMENDED</span>` : ''}
          </div>
          <span style="font-size:11px;color:var(--muted);white-space:nowrap;">OI ${cfg.tierP.oiLo} - ${cfg.tierP.oiHi}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-bottom:1px solid var(--border);">
          ${top.map(([label, value, c], i) => `
            <div style="padding:14px 18px;${i < top.length - 1 ? 'border-right:1px solid var(--border);' : ''}">
              <div style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.45px;margin-bottom:5px;">${label}</div>
              <div class="mono" style="font-size:${label === 'mmFactor' ? '13px' : '20px'};font-weight:800;color:${c};word-break:break-all;line-height:1.25;">${esc(value)}</div>
            </div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));">
          ${rows.map(([label, value, hint], i) => `
            <div style="padding:14px 18px;border-top:${i < 3 ? '0' : '1px solid var(--border)'};${(i + 1) % 3 ? 'border-right:1px solid var(--border);' : ''}">
              <div style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.45px;margin-bottom:5px;">${label}</div>
              <div class="mono" style="font-size:17px;font-weight:800;color:var(--text);word-break:break-all;line-height:1.25;">${esc(value)}</div>
              <div style="font-size:10px;color:var(--muted);margin-top:4px;">${esc(hint)}</div>
            </div>`).join('')}
        </div>
      </div>`;
  };

  return `
    <div style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;">

        ${configs.length > 1 ? `<span style="font-size:11px;color:var(--yellow);">Score is within 10% of a tier boundary; showing ${configs.length} options</span>` : ''}

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px;">
        ${configs.map(renderOption).join('')}

}

// ─── RENDER: detail ───────────────────────────────────────────────────────────
function renderDetail(r) {

  const tierLabel = r.finalTier + (r.whitelistCap ? ' [whitelist cap]' : '') + (r.ageCapped ? ' [age cap]' : '');

            ? `<span style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);color:var(--green);font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;">ELIGIBLE</span>`
            : `<span style="background:rgba(239,68,68,0.10);border:1px solid rgba(239,68,68,0.25);color:var(--red);font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;">NOT ELIGIBLE</span>`
          }
        </div>
        <div class="detail-subline">Rank #${r.rank || '—'} &bull; Data: CoinGecko + Hyperliquid</div>
      </div>
      <div class="detail-actions">

        ${[['PRICE', fmtPrice(r.price)], ['FDMC', fmtBig(r.fdmc)], ['MCAP', fmtBig(r.mcap)]].map(([l, v]) => `

  // Gates

  } else {

    html += `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin-bottom:20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">

                <circle cx="36" cy="36" r="30" fill="none" stroke="var(--border)" stroke-width="6"/>

                  stroke-dasharray="${2 * Math.PI * 30}"
                  stroke-dashoffset="${2 * Math.PI * 30 * (1 - pct / 100)}"
                  stroke-linecap="round" transform="rotate(-90 36 36)"
                  style="transition:stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1);"/>
              </svg>
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:${sc};">${r.totalScore}</div>
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px;">
                <div style="font-size:12px;color:var(--muted);font-weight:500;">LISTING SCORE</div>

            <div style="background:var(--elevated);border:1px solid var(--border);border-radius:10px;padding:12px 16px;text-align:center;">

            <div style="background:var(--elevated);border:1px solid var(--border);border-radius:10px;padding:12px 16px;text-align:center;">
              <div style="font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0.5px;margin-bottom:4px;">MAX LEVERAGE</div>
              <div class="mono" style="font-size:20px;font-weight:800;color:${sc};">${r.tierP.maxLev}<span style="font-size:13px;color:var(--muted);">×</span></div>

          </div>

        ${(r.ageCapped || r.whitelistCap) ? `

    // Metric breakdown
    html += `
      <div style="margin-bottom:20px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
          <svg width="16" height="16" fill="none" stroke="var(--orange)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>

          </div>
          ${Object.entries(r.metrics).map(([key, m]) => {
            const pct = Math.round((m.score / m.w) * 100);
            const bc  = pct >= 80 ? '#22c55e' : pct >= 50 ? '#f59e0b' : '#ef4444';
            const d   = m.detail;
            const isO = openMetric === key;
            return `
              <div>
                <div class="metric-row" onclick="toggleMetric('${key}')"
                  style="display:grid;grid-template-columns:1fr 180px 90px 90px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center;transition:background 0.15s;">
                  <div style="display:flex;align-items:center;gap:8px;">
                    <svg style="color:${isO ? 'var(--orange)' : 'var(--muted)'};flex-shrink:0;transform:rotate(${isO ? 90 : 0}deg);transition:transform 0.2s;" width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                    </svg>
                    <div>
                      <div style="font-size:13px;font-weight:600;color:var(--text);">${m.label}</div>
                      <div style="font-size:11px;color:var(--muted);">${d.hiB ? '↑ higher is better' : '↓ lower is better'}${m.flag ? ' · <span style="color:var(--yellow);">⚠ '+m.flag+'</span>' : ''}</div>
                    </div>
                  </div>
                  <div style="padding-right:16px;">
                    <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
                      <span style="font-size:10px;color:var(--muted);">${m.score.toFixed(1)}/${m.w} pts</span>
                      <span style="font-size:10px;color:${bc};font-weight:600;">${pct}%</span>

                      <div style="height:100%;width:${pct}%;background:${bc};border-radius:3px;"></div>
                    </div>
                  </div>
                  <div class="mono" style="text-align:right;font-size:14px;font-weight:700;color:${bc};">${m.score.toFixed(1)}<span style="font-size:11px;color:var(--muted);font-weight:400;">/${m.w}</span></div>
                  <div class="mono" style="text-align:right;font-size:12px;font-weight:600;color:var(--text);">${m.rawFmt}</div>
                </div>
                <div class="accordion-content ${isO ? 'open' : ''}" id="acc-${key}">
                  <div style="padding:16px 20px;background:#0e1016;border-bottom:1px solid var(--border);">
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
                      ${[['WHAT',d.what],['WHY IT MATTERS',d.why],['FORMULA',d.formula]].map(([t,v],i) => `
                        <div>
                          <div style="font-size:10px;font-weight:700;color:var(--orange);letter-spacing:0.8px;margin-bottom:6px;">${t}</div>
                          ${i===2
                            ? `<div class="mono" style="font-size:11px;color:#a5b4fc;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);border-radius:6px;padding:8px 10px;line-height:1.6;">${v}</div>`
                            : `<p style="font-size:12px;color:var(--muted);margin:0;line-height:1.5;">${v}</p>`
                          }
                        </div>`).join('')}
                    </div>
                  </div>
                </div>
              </div>`;
          }).join('')}
          <div style="display:grid;grid-template-columns:1fr 180px 90px 90px;padding:12px 16px;background:rgba(249,115,22,0.05);">
            <div style="font-size:13px;font-weight:700;color:var(--text);">Total Score</div>
            <div></div>
            <div class="mono" style="text-align:right;font-size:14px;font-weight:800;color:${sc};">${r.totalScore}<span style="font-size:11px;color:var(--muted);font-weight:400;">/100</span></div>
            <div></div>
          </div>
        </div>
      </div>
    `;

    // Radar profile section (populated async by loadDetailRadar)
    html += `
      <div style="margin-bottom:20px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
          <svg width="16" height="16" fill="none" stroke="var(--orange)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.783-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
          <h2 style="font-size:14px;font-weight:700;color:var(--text);margin:0;">RADAR PROFILE</h2>
          <span style="font-size:11px;color:var(--muted);">5-bucket signal score · R ∈ [0, 100]</span>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;">
          ${renderRadarDetailSection(r.cgId)}
        </div>
      </div>
    `;

    html += renderSuggestedListingConfig(r, sc);

    html += `<div id="exchange-ref-section">${renderExchangeReferenceSection(r.symbol)}</div>`;
    html += renderExchangeSection(r);
  }

  panel.innerHTML = html;
}

function renderExchangeReferenceSection(symbol) {
  const sym = refSymbol(symbol);
  const st = exchangeRefCache.get(sym) || emptyExchangeRefState(sym);
  const order = [
    ['binance', 'Binance'],
    ['hyperliquid', 'Hyperliquid'],
    ['aster', 'Aster'],
    ['lighter', 'Lighter'],
  ];
  const updatedText = st.updatedAt
    ? `Updated ${new Date(st.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
    : 'Fetching live settings';

  const card = ([key, label]) => {
    const ref = st.refs[key] || { status: 'loading' };
    if (ref.status === 'loading') {
      return `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-height:138px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div style="font-size:12px;font-weight:800;color:var(--text);">${label}</div>
            <span class="spinner-sm"></span>
          </div>
          <div style="font-size:12px;color:var(--muted);">Fetching current perp settings...</div>
        </div>`;
    }

    if (ref.status === 'error') {
      return `
        <div style="background:var(--surface);border:1px solid rgba(239,68,68,0.25);border-radius:10px;padding:14px 16px;min-height:138px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div style="font-size:12px;font-weight:800;color:var(--text);">${label}</div>
            <span style="font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px;background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.25);">ERR</span>
          </div>
          <div style="font-size:12px;color:var(--red);line-height:1.45;">${esc(ref.error || 'Unavailable')}</div>
        </div>`;
    }

    const d = ref.data || {};
    if (!d.listed) {
      return '';
    }

    const statusLabel = exchangeStatusLabel(d.status);
    const statusColor = statusLabel.includes('ISOLATED') ? 'var(--yellow)' : 'var(--green)';
    const cells = [
      ['MAX LEV', d.maxLev ? d.maxLev + 'x' : '—'],
      ['STEP SIZE', fmtDecimal(d.stepSize)],
      ['STEP PRICE', fmtDecimal(d.stepPrice)],
      ['IMR', marginPct(d.imr)],
      ['MMR', marginPct(d.mmr)],
      ['CMR', marginPct(d.cmr)],
      ['LIMIT', d.limit || '—'],
    ];

    return `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-height:172px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
          <div style="min-width:0;">
            <div style="font-size:12px;font-weight:800;color:var(--text);">${label}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(d.market || sym)} perp</div>
          </div>
          <span style="font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px;background:rgba(34,197,94,0.10);color:${statusColor};border:1px solid rgba(34,197,94,0.22);">${esc(statusLabel)}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;">
          ${cells.map(([k, v]) => `
            <div>
              <div style="font-size:9px;color:var(--muted);font-weight:700;letter-spacing:0.45px;margin-bottom:2px;">${k}</div>
              <div class="mono" style="font-size:13px;font-weight:800;color:${k === 'MAX LEV' ? 'var(--orange)' : 'var(--text)'};word-break:break-all;">${esc(v)}</div>
            </div>`).join('')}
        </div>
      </div>`;
  };

  return `
    <div style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="16" height="16" fill="none" stroke="var(--orange)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h18M5 7v12m14-12v12M8 11h2m4 0h2M8 15h2m4 0h2M4 19h20"/></svg>
          <h2 style="font-size:14px;font-weight:700;color:var(--text);margin:0;">REFERENCED EXCHANGE SETTINGS</h2>
          <span style="font-size:11px;color:var(--muted);">${updatedText}</span>
        </div>
        <button class="icon-btn" onclick="loadExchangeReferences('${sym}', true)" ${st.status === 'loading' ? 'disabled' : ''}
          title="${st.status === 'loading' ? 'Refreshing references' : 'Refresh exchange references'}"
          aria-label="${st.status === 'loading' ? 'Refreshing references' : 'Refresh exchange references'}">
          ${st.status === 'loading'
            ? '<span class="spinner-sm"></span>'
            : '<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 00-15.74-5.74L3 8"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v5h5"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12a9 9 0 0015.74 5.74L21 16"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 16h5v5"/></svg>'}
        </button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;">
        ${order.map(card).filter(Boolean).join('') || `<div style="font-size:12px;color:var(--muted);">No referenced exchange settings available for ${esc(sym)}.</div>`}
      </div>
    </div>`;
}

function renderExchangeSection(r) {
  if (!r.exchanges || !r.exchanges.length) return '';
  return `
    <div style="margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <svg width="16" height="16" fill="none" stroke="var(--orange)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
        <h2 style="font-size:14px;font-weight:700;color:var(--text);margin:0;">EXCHANGE PRESENCE</h2>
        <span style="font-size:11px;color:var(--muted);">Tier-1/2 only</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${r.exchanges.map(ex => `<span class="exchange-badge ${CFG.TIER1.has(ex) ? 't1' : 't2'}">${ex}${CFG.TIER1.has(ex) ? ' T1' : ' T2'}</span>`).join('')}
      </div>
    </div>
  `;
}

// ─── INTERACTION ──────────────────────────────────────────────────────────────
let _lastSelectedCgId = null;
let _lastSelectedSymbol = null;
let _lastSelectedSafety = null;
let _lastSelectedFeed = null;
let _lastSelectedCmcId = null;
let _activeAnalysisRun = 0;
let _activeAnalysisCgId = null;

function retrySelected() {
  if (!_lastSelectedCgId || _activeAnalysisCgId === _lastSelectedCgId) return;
  resultCache.delete(_lastSelectedCgId);
  if (_lastSelectedSymbol) loadExchangeReferences(_lastSelectedSymbol, true);
  selectToken(_lastSelectedCgId, _lastSelectedSymbol, _lastSelectedSafety, _lastSelectedFeed, _lastSelectedCmcId);
}

async function selectToken(cgId, symbol, safetyScore, feedGrade, cmcId = null) {
  const runId = ++_activeAnalysisRun;
  selectedRadarSymbol = null;
  _activeAnalysisCgId = cgId;
  _lastSelectedCgId = cgId;
  _lastSelectedSymbol = symbol;
  _lastSelectedSafety = safetyScore;
  _lastSelectedFeed = feedGrade;
  _lastSelectedCmcId = cmcId || CMC_IDS_BY_SYMBOL[symbol] || null;
  selectedCgId = cgId;
  openMetric = null;
  renderTokenList();
  loadExchangeReferences(symbol);

  const panel = document.getElementById('detail-panel');
  panel.classList.add('fade-out');
  await new Promise(r => setTimeout(r, 150));
  if (runId !== _activeAnalysisRun || selectedCgId !== cgId) return;
  panel.classList.remove('fade-out');

  // Cached result: render immediately with no loading states
  if (resultCache.has(cgId)) {
    if (runId === _activeAnalysisRun) _activeAnalysisCgId = null;
    renderDetail(resultCache.get(cgId));
    loadDetailRadar(cgId, symbol);
    return;
  }

  renderLoading('Fetching market data…');
  try {
    // Progressive: shows header after first fetch, then gates/metrics as each
    // API call resolves. renderDetail is called at the end with the full result.
    const result = await analyzeTokenProg(cgId, symbol, safetyScore, feedGrade, _lastSelectedCmcId);
    if (runId !== _activeAnalysisRun || selectedCgId !== cgId) return;
    _activeAnalysisCgId = null;
    if (result) {
      renderDetail(result);
      renderTokenList(); // refresh scores in left panel
      loadDetailRadar(cgId, symbol);
    }
  } catch (err) {
    if (runId !== _activeAnalysisRun || selectedCgId !== cgId) return;
    _activeAnalysisCgId = null;
    renderError(err, symbol);
  }
}

function toggleMetric(key) {
  openMetric = openMetric === key ? null : key;
  // Close all, open the selected one
  document.querySelectorAll('.accordion-content').forEach(el => el.classList.remove('open'));
  if (openMetric) {
    const el = document.getElementById('acc-' + openMetric);
    if (el) el.classList.add('open');
  }
  // Update chevrons — onclick is on the .metric-row element itself
  document.querySelectorAll('.metric-row').forEach(row => {
    const onclick = row.getAttribute('onclick') || '';
    const match = onclick.match(/'([^']+)'/);
    const k = match ? match[1] : null;
    if (!k) return;
    const svg = row.querySelector('svg');
    if (!svg) return;
    const isO = openMetric === k;
    svg.style.transform = `rotate(${isO ? 90 : 0}deg)`;
    svg.style.color = isO ? 'var(--orange)' : 'var(--muted)';
  });
}

// ─── TOP COINS ────────────────────────────────────────────────────────────────
// Fetches top-50 by market cap, strips stables/wrapped tokens, keeps top 20.
// Falls back to KNOWN list on any network or parse error.
async function loadTopCoins() {
  try {
    const coins = await cgGet('/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50&page=1&sparkline=false');
    if (!Array.isArray(coins)) return;
    const filtered = coins.filter(c => c.id && c.symbol && !isExcluded(c)).slice(0, 20);
    if (!filtered.length) return;
    tokenList = filtered.map(c => {
      const sym = c.symbol.toUpperCase();
      const known = KNOWN[sym];
      return {
        symbol: sym,
        cgId:   c.id,
        cmcId:  known?.cmcId || CMC_IDS_BY_SYMBOL[sym],
        name:   c.name  || sym,
        rank:   c.market_cap_rank || null,
        thumb:  c.image || null,
        safetyScore: known?.safetyScore ?? 75,
        feedGrade:   known?.feedGrade   ?? 'A',
      };
    });
    renderTokenList();
  } catch (e) {
    // Keep the KNOWN list on failure; user can still search any token.
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
(function init() {
  loadSettings();
  updateSyncStamp();

  // Show users which live data paths the static page is using.
  {
    const notice = document.createElement('div');
    notice.style.cssText = 'background:rgba(148,163,184,0.05);border-bottom:1px solid var(--border);padding:5px 24px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative;z-index:1;';
    notice.innerHTML = `<svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>CoinGecko direct API with proxy fallback · RISEx/Lighter/Binance references with fallback · Hyperliquid direct${_IS_FILE ? ' (skipped on file://)' : ''}`;
    document.querySelector('#main-content').before(notice);
  }

  renderTokenList();
  renderWelcome();
  refreshSideRail();
  loadRiseMarkets();
  loadTrendingTokens();
  loadTopCoins();
  loadListingRadar();
  scheduleListingRadarRefresh();
  scheduleAutoRefresh();
})();
</script>
