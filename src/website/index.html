// ─── RENDER: RISEx markets ───────────────────────────────────────────────────
function numOrNull(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function normalizeRiseMarket(m) {
  const displayName = m.display_name || m.config?.name || m.underlying || m.base_asset_symbol || '';
  if (!displayName || /\bdeprecated\b/i.test(displayName) || m.visible === false) return null;

  const symbol = String(displayName).split('/')[0].replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  if (!symbol) return null;
  const markPrice = numOrNull(m.mark_price) ?? numOrNull(m.index_price) ?? numOrNull(m.last_price);
  const lastPrice = numOrNull(m.last_price);
  const change24h = numOrNull(m.change_24h);
  const prevPrice = lastPrice !== null && change24h !== null ? lastPrice - change24h : null;
  const changePct24h = prevPrice && prevPrice > 0 && change24h !== null ? change24h / prevPrice : null;
  const openInterest = numOrNull(m.open_interest);
  const oiLimit = numOrNull(m.config?.open_interest_limit);
  const stepSize = numOrNull(m.config?.step_size);
  const stepPrice = numOrNull(m.config?.step_price);
  const maxLeverage = numOrNull(m.config?.max_leverage);
  const mmFactor = numOrNull(m.config?.maintenance_margin_factor);
  const minOrderSize = numOrNull(m.config?.min_order_size);

  return {
    id: m.market_id,
    symbol,
    name: displayName,
    quote: m.quote_asset_symbol || 'USDC',
    status: m.post_only ? 'POST ONLY' : (m.available ? 'LIVE' : 'OFFLINE'),
    postOnly: Boolean(m.post_only),
    available: Boolean(m.available),
    markPrice,
    lastPrice,
    change24h,
    changePct24h,
    volume24h: numOrNull(m.quote_volume_24h),
    openInterest,
    openInterestUsd: openInterest !== null && markPrice !== null ? openInterest * markPrice : null,
    oiLimit,
    oiLimitUsd: oiLimit !== null && markPrice !== null ? oiLimit * markPrice : null,
    maxLeverage,
    stepSize,
    stepPrice,
    mmFactor,
    minOrderSize,
    minOrderStep: minOrderSize !== null && stepSize ? minOrderSize / stepSize : null,
    oiLimitSteps: oiLimit !== null && stepSize ? oiLimit / stepSize : null,
    config: m.config || {},
    funding8h: numOrNull(m.funding_rate_8h),
    canScreen: Boolean(KNOWN[symbol]),
  };
}

async function fetchRiseMarkets() {
  let lastErr = null;
  for (const src of RISE_MARKET_SOURCES) {
    try {
      const r = await fetchWithTimeout(src.url, {}, src.timeoutMs);
      if (!r.ok) {
        lastErr = new Error(`${src.name} ${r.status}`);
        continue;
      }
      const data = await src.parse(r);
      const markets = data?.data?.markets;
      if (!Array.isArray(markets)) {
        lastErr = new Error(`${src.name}: empty markets`);
        continue;
      }
      return { markets, cachedAt: data?.data?.cached_at || null };
    } catch (err) {
      lastErr = new Error(`${src.name}: ${errMsg(err)}`);
    }
  }
  throw lastErr || new Error('RISEx markets unavailable');
}

function refreshRiseMarketsSection() {
  const el = document.getElementById('rise-markets-section');
  if (el) el.innerHTML = renderRiseMarketsSection();
  refreshSideRail();
}

async function loadRiseMarkets(force = false) {
  if (riseMarketsState.status === 'loading') return;
  if (!force && riseMarketsState.status === 'loaded') return;

  riseMarketsState = { ...riseMarketsState, status: 'loading', error: null };
  refreshRiseMarketsSection();
  try {
    const data = await fetchRiseMarkets();
    const markets = data.markets
      .map(normalizeRiseMarket)
      .filter(Boolean)
      .sort((a, b) => {
        if (a.postOnly !== b.postOnly) return a.postOnly ? 1 : -1;
        return Number(a.id) - Number(b.id);
      });
    riseMarketsState = { status: 'loaded', markets, error: null, cachedAt: data.cachedAt };
    updateSyncStamp();
  } catch (err) {
    riseMarketsState = { status: 'error', markets: [], error: errMsg(err), cachedAt: null };
  }
  refreshRiseMarketsSection();
}

function retryRiseMarkets() {
  loadRiseMarkets(true);
}

function toggleRiseMarketDetails(id) {
  const key = String(id || '');
  expandedRiseMarketId = expandedRiseMarketId === key ? null : key;
  refreshSideRail();
}

function screenRiseMarket(symbol) {
  const sym = String(symbol || '').toUpperCase();
  const found = tokenList.find(t => t.symbol === sym);
  const known = KNOWN[sym];
  const t = found || (known ? {
    symbol: sym,
    cgId: known.cgId,
    cmcId: known.cmcId || CMC_IDS_BY_SYMBOL[sym] || null,
    safetyScore: known.safetyScore,
    feedGrade: known.feedGrade,
  } : null);
  if (!t) return;
  selectToken(t.cgId, t.symbol, t.safetyScore, t.feedGrade, t.cmcId || CMC_IDS_BY_SYMBOL[sym] || null);
}

function refreshSideRail() {

}

function syncStampText(date = new Date()) {
  const pad = n => String(n).padStart(2, '0');
  return `${date.getUTCFullYear()}-${pad(date.getUTCMonth()+1)}-${pad(date.getUTCDate())} ${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())}:${pad(date.getUTCSeconds())} UTC`;
}

function updateSyncStamp(date = new Date()) {
  const el = document.getElementById('sync-stamp');
  if (el) el.textContent = 'LAST SYNC: ' + syncStampText(date);
}

function setAutoRefreshBusy(busy) {
  autoRefreshBusy = busy;
  const btn = document.getElementById('auto-refresh-btn');
  if (!btn) return;
  btn.disabled = busy;
  btn.classList.toggle('refreshing', busy);
}

function scheduleAutoRefresh() {
  if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
  autoRefreshTimer = setTimeout(runAutoRefresh, AUTO_REFRESH_MS);
}

async function runAutoRefresh() {
  if (autoRefreshBusy) {
    scheduleAutoRefresh();
    return;
  }
  setAutoRefreshBusy(true);
  try {
    await loadRiseMarkets(true);
  } finally {
    setAutoRefreshBusy(false);
    scheduleAutoRefresh();
  }
}

function manualAutoRefresh() {
  if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
  runAutoRefresh();
}

async function loadTrendingTokens(force = false) {
  if (trendingState.status === 'loading') return;
  if (!force && trendingState.status === 'loaded') return;

  trendingState = { ...trendingState, status: 'loading', error: null };
  refreshSideRail();
  try {
    const data = await cgGet('/search/trending');
    const tokens = (data?.coins || []).map(row => row.item).filter(Boolean).slice(0, 8).map(item => ({
      id: item.id,
      symbol: String(item.symbol || '').toUpperCase(),
      name: item.name || item.symbol || 'Token',
      rank: item.market_cap_rank || null,
      thumb: item.thumb || item.small || null,
    }));
    trendingState = { status: 'loaded', tokens, error: null };
  } catch (err) {
    trendingState = { status: 'error', tokens: [], error: errMsg(err) };
  }
  refreshSideRail();
}

function retryTrendingTokens() {

}

  }

  if (st.status === 'error') {
    return renderRailCard('RISEx Markets', 'Live deployed markets', action, `
      <div style="font-size:12px;color:var(--red);line-height:1.45;">${esc(st.error || 'Unavailable')}</div>`);
  }

  const markets = st.markets;
  const activeCount = st.markets.filter(m => !m.postOnly && m.available).length;
  const changeCell = m => {
    if (m.changePct24h === null) return `<span class="mono" style="font-size:11px;color:var(--muted);">—</span>`;
    const up = m.changePct24h >= 0;
    return `<span class="mono" style="font-size:11px;font-weight:800;color:${up ? 'var(--green)' : 'var(--red)'};">${up ? '+' : ''}${fmtPct(m.changePct24h)}</span>`;
  };
  const configGrid = m => {
    const maxLev = m.maxLeverage || null;
    const imr = maxLev ? 1 / maxLev : null;
    const mmr = m.mmFactor ? 1 / m.mmFactor : null;
    const fields = [
      ['MaxLeverage', maxLev ? `${maxLev}x` : '—'],
      ['IMR', marginPct(imr)],
      ['MMR', marginPct(mmr)],
      ['mmFactor', m.mmFactor ? `${fmtDecimal(m.mmFactor)} * 1e18` : '—'],
      ['StepPrice', fmtDecimal(m.stepPrice)],
      ['StepSize', fmtDecimal(m.stepSize)],
      ['MinOrderStep', fmtPlainInt(m.minOrderStep)],
      ['OILimitSteps', fmtPlainInt(m.oiLimitSteps)],
      ['MaxOrderStep', m.oiLimitSteps ? fmtPlainInt(m.oiLimitSteps / 10) : '—'],
      ['PriceBand', '—'],
      ['ImpactNotional', '—'],
    ];
    return `
      <div style="grid-column:1 / -1;background:#0b0d12;border-top:1px solid var(--border);padding:10px 12px;">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:8px 10px;">
          ${fields.map(([label, value]) => `
            <div>
              <div style="font-size:9px;color:var(--muted);font-weight:800;letter-spacing:0.45px;margin-bottom:2px;">${label}</div>
              <div class="mono" style="font-size:12px;font-weight:800;color:var(--text);word-break:break-all;">${esc(value)}</div>
            </div>`).join('')}
        </div>
      </div>`;
  };
  return renderRailCard('RISEx Markets', `${activeCount} live · ${st.markets.length} total`, action, `
    <div style="background:#0e1016;border:1px solid var(--border);border-radius:10px;overflow:hidden;">
      <div class="rise-market-grid rise-market-head">
        ${['','TOKEN','LEV','PRICE','24H','VOL','OI'].map((h, i) => `<div style="font-size:9px;font-weight:800;color:var(--muted);letter-spacing:0.45px;${i > 1 ? 'text-align:right;' : ''}">${h}</div>`).join('')}
      </div>
      ${markets.map(m => {
        const rowKey = String(m.id || m.symbol);
        const expanded = expandedRiseMarketId === rowKey;
        const statusClass = m.postOnly ? 'post-only' : (m.available ? 'live' : 'offline');
        return `
          <div class="rise-market-grid rise-market-row">
            <button onclick="${esc(`toggleRiseMarketDetails(${jsStr(rowKey)})`)}"
              title="${expanded ? 'Hide market config' : 'Show market config'}"
              aria-label="${expanded ? 'Hide market config' : 'Show market config'}"
              style="width:22px;height:50px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);cursor:pointer;padding:0;">
              <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="transform:rotate(${expanded ? 90 : 0}deg);transition:transform 0.15s;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 6l6 6-6 6"/></svg>
            </button>
            <button onclick="${m.canScreen ? esc(`screenRiseMarket(${jsStr(m.symbol)})`) : ''}"
              ${m.canScreen ? '' : 'disabled'}
              title="${m.canScreen ? 'Screen token' : 'Market only'}"
              style="min-width:0;text-align:left;background:transparent;border:none;padding:10px 0;color:inherit;${m.canScreen ? 'cursor:pointer;' : 'cursor:default;'}">
              <div style="min-width:0;">
                <div style="font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(m.symbol)}</div>
                <div class="rise-market-status ${statusClass}">${esc(m.status)}</div>
              </div>
            </button>
            <div class="mono" style="font-size:11px;font-weight:800;color:var(--orange);text-align:right;">${m.maxLeverage ? m.maxLeverage + 'x' : '—'}</div>
            <div class="mono" style="font-size:11px;font-weight:800;color:var(--text);text-align:right;white-space:nowrap;">${fmtPrice(m.markPrice)}</div>
            <div style="text-align:right;white-space:nowrap;">${changeCell(m)}</div>
            <div class="mono" style="font-size:11px;font-weight:800;color:var(--text);text-align:right;white-space:nowrap;">${fmtBig(m.volume24h)}</div>
            <div class="mono" style="font-size:11px;font-weight:800;color:var(--text);text-align:right;white-space:nowrap;">${fmtBig(m.openInterestUsd)}</div>
            ${expanded ? configGrid(m) : ''}
          </div>`;
      }).join('')}
    </div>`);
}

                <div style="min-width:0;">
                  <div style="font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(m.name)}</div>
                  <div style="font-size:10px;color:var(--muted);">${m.canScreen ? 'Screener ready' : 'Market only'}</div>
                </div>

              <div class="mono" style="font-size:12px;font-weight:800;color:var(--orange);text-align:right;">${m.maxLeverage ? m.maxLeverage + 'x' : '—'}</div>
            </div>`;
        }).join('')}
      </div>
    </div>`);
}

function renderSuggestedListingConfig(r, sc) {
  const configs = suggestedTierOptions(r)
    .map(tier => computeSuggestedConfig(r, tier))
    .filter(Boolean);
  if (!configs.length) return '';

  const renderOption = (cfg) => {
    const color = tierColor(cfg.tier);
    const isRecommended = cfg.tier === r.finalTier;
    const top = [
      ['MaxLeverage', `${cfg.maxLev}x`, color],
      ['IMR', fmtConfigPct(cfg.imr), 'var(--text)'],
      ['MMR', fmtConfigPct(cfg.mmr), 'var(--text)'],
      ['mmFactor', fmtFactorExpr(cfg.mmFactor), '#a5b4fc'],
    ];
    const rows = [
      ['StepPrice', fmtDecimal(cfg.stepPrice), `${fmtBps(cfg.stepPrice / r.price)} per tick`],
      ['StepSize', fmtDecimal(cfg.stepSize), `≈ ${fmtUsdPrecise(cfg.stepSize * r.price)} per step`],
      ['MinOrderStep', fmtPlainInt(cfg.minOrderStep), cfg.minOrderUsd ? `≈ ${fmtBig(cfg.minOrderUsd)}` : `≈ ${fmtBig(CFG.EXPECTED_MIN_ORDER_USD)}`],
      ['OILimitSteps', fmtPlainInt(cfg.oiLimitSteps), cfg.oiLimitUsd ? `≈ ${fmtBig(cfg.oiLimitUsd)} lower OI` : `≈ ${cfg.tierP.oiLo}`],
      ['MaxOrderStep', fmtPlainInt(cfg.maxOrderStep), cfg.oiLimitUsd ? `≈ ${fmtBig(cfg.oiLimitUsd / 10)}` : 'OILimitSteps / 10'],
      ['PriceBand', fmtConfigPct(cfg.priceBand), ''],
      ['ImpactNotional', fmtBig(cfg.impactNotional), ''],
    ];

    return `
      <div style="background:var(--surface);border:1px solid ${isRecommended ? 'rgba(249,115,22,0.55)' : 'var(--border)'};border-radius:12px;overflow:hidden;box-shadow:${isRecommended ? '0 0 0 1px rgba(249,115,22,0.16)' : 'none'};">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="${tierClass(cfg.tier)}" style="font-size:11px;font-weight:800;letter-spacing:0.4px;padding:4px 10px;border-radius:6px;">${cfg.tier} Option</span>
            ${isRecommended ? `<span style="font-size:10px;font-weight:800;color:var(--orange);background:rgba(249,115,22,0.10);border:1px solid rgba(249,115,22,0.28);border-radius:5px;padding:3px 7px;">RECOMMENDED</span>` : ''}
          </div>
          <span style="font-size:11px;color:var(--muted);white-space:nowrap;">OI ${cfg.tierP.oiLo} - ${cfg.tierP.oiHi}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-bottom:1px solid var(--border);">
          ${top.map(([label, value, c], i) => `
            <div style="padding:14px 18px;${i < top.length - 1 ? 'border-right:1px solid var(--border);' : ''}">
              <div style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.45px;margin-bottom:5px;">${label}</div>
              <div class="mono" style="font-size:${label === 'mmFactor' ? '13px' : '20px'};font-weight:800;color:${c};word-break:break-all;line-height:1.25;">${esc(value)}</div>
            </div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));">
          ${rows.map(([label, value, hint], i) => `
            <div style="padding:14px 18px;border-top:${i < 3 ? '0' : '1px solid var(--border)'};${(i + 1) % 3 ? 'border-right:1px solid var(--border);' : ''}">

              <div style="font-size:10px;color:var(--muted);margin-top:4px;">${esc(hint)}</div>
            </div>`).join('')}
        </div>
      </div>`;
  };

  return `
    <div style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <svg width="16" height="16" fill="none" stroke="var(--orange)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px;">
        ${configs.map(renderOption).join('')}
      </div>
    </div>`;
}

    html += `<div id="exchange-ref-section">${renderExchangeReferenceSection(r.symbol)}</div>`;

function renderExchangeReferenceSection(symbol) {
  const sym = refSymbol(symbol);
  const st = exchangeRefCache.get(sym) || emptyExchangeRefState(sym);
  const order = [
    ['binance', 'Binance'],
    ['hyperliquid', 'Hyperliquid'],
    ['aster', 'Aster'],
    ['lighter', 'Lighter'],
  ];
  const updatedText = st.updatedAt
    ? `Updated ${new Date(st.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
    : 'Fetching live settings';

  const card = ([key, label]) => {
    const ref = st.refs[key] || { status: 'loading' };
    if (ref.status === 'loading') {
      return `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-height:138px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div style="font-size:12px;font-weight:800;color:var(--text);">${label}</div>
            <span class="spinner-sm"></span>
          </div>
          <div style="font-size:12px;color:var(--muted);">Fetching current perp settings...</div>
        </div>`;
    }

    if (ref.status === 'error') {
      return `
        <div style="background:var(--surface);border:1px solid rgba(239,68,68,0.25);border-radius:10px;padding:14px 16px;min-height:138px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div style="font-size:12px;font-weight:800;color:var(--text);">${label}</div>
            <span style="font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px;background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.25);">ERR</span>
          </div>
          <div style="font-size:12px;color:var(--red);line-height:1.45;">${esc(ref.error || 'Unavailable')}</div>
        </div>`;
    }

    const d = ref.data || {};
    if (!d.listed) {
      return '';
    }

    const statusLabel = exchangeStatusLabel(d.status);
    const statusColor = statusLabel.includes('ISOLATED') ? 'var(--yellow)' : 'var(--green)';
    const cells = [
      ['MAX LEV', d.maxLev ? d.maxLev + 'x' : '—'],
      ['STEP SIZE', fmtDecimal(d.stepSize)],
      ['STEP PRICE', fmtDecimal(d.stepPrice)],
      ['IMR', marginPct(d.imr)],
      ['MMR', marginPct(d.mmr)],
      ['CMR', marginPct(d.cmr)],
      ['LIMIT', d.limit || '—'],
    ];

    return `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-height:172px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
          <div style="min-width:0;">
            <div style="font-size:12px;font-weight:800;color:var(--text);">${label}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(d.market || sym)} perp</div>
          </div>
          <span style="font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px;background:rgba(34,197,94,0.10);color:${statusColor};border:1px solid rgba(34,197,94,0.22);">${esc(statusLabel)}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;">
          ${cells.map(([k, v]) => `
            <div>
              <div style="font-size:9px;color:var(--muted);font-weight:700;letter-spacing:0.45px;margin-bottom:2px;">${k}</div>
              <div class="mono" style="font-size:13px;font-weight:800;color:${k === 'MAX LEV' ? 'var(--orange)' : 'var(--text)'};word-break:break-all;">${esc(v)}</div>
            </div>`).join('')}
        </div>
      </div>`;
  };

  return `
    <div style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="16" height="16" fill="none" stroke="var(--orange)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h18M5 7v12m14-12v12M8 11h2m4 0h2M8 15h2m4 0h2M4 19h20"/></svg>
          <h2 style="font-size:14px;font-weight:700;color:var(--text);margin:0;">REFERENCED EXCHANGE SETTINGS</h2>
          <span style="font-size:11px;color:var(--muted);">${updatedText}</span>
        </div>
        <button class="icon-btn" onclick="loadExchangeReferences('${sym}', true)" ${st.status === 'loading' ? 'disabled' : ''}
          title="${st.status === 'loading' ? 'Refreshing references' : 'Refresh exchange references'}"
          aria-label="${st.status === 'loading' ? 'Refreshing references' : 'Refresh exchange references'}">
          ${st.status === 'loading'
            ? '<span class="spinner-sm"></span>'
            : '<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 00-15.74-5.74L3 8"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v5h5"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12a9 9 0 0015.74 5.74L21 16"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 16h5v5"/></svg>'}
        </button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;">
        ${order.map(card).filter(Boolean).join('') || `<div style="font-size:12px;color:var(--muted);">No referenced exchange settings available for ${esc(sym)}.</div>`}
      </div>
    </div>`;
}

function renderExchangeSection(r) {
  if (!r.exchanges || !r.exchanges.length) return '';
  return `
    <div style="margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <svg width="16" height="16" fill="none" stroke="var(--orange)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
        <h2 style="font-size:14px;font-weight:700;color:var(--text);margin:0;">EXCHANGE PRESENCE</h2>
        <span style="font-size:11px;color:var(--muted);">Tier-1/2 only</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${r.exchanges.map(ex => `<span class="exchange-badge ${CFG.TIER1.has(ex) ? 't1' : 't2'}">${ex}${CFG.TIER1.has(ex) ? ' T1' : ' T2'}</span>`).join('')}
      </div>
    </div>
  `;
}

// ─── INTERACTION ──────────────────────────────────────────────────────────────
let _lastSelectedCgId = null;
let _lastSelectedSymbol = null;
let _lastSelectedSafety = null;
let _lastSelectedFeed = null;
let _lastSelectedCmcId = null;
let _activeAnalysisRun = 0;
let _activeAnalysisCgId = null;

function retrySelected() {
  if (!_lastSelectedCgId || _activeAnalysisCgId === _lastSelectedCgId) return;
  resultCache.delete(_lastSelectedCgId);
  if (_lastSelectedSymbol) loadExchangeReferences(_lastSelectedSymbol, true);
  selectToken(_lastSelectedCgId, _lastSelectedSymbol, _lastSelectedSafety, _lastSelectedFeed, _lastSelectedCmcId);
}

async function selectToken(cgId, symbol, safetyScore, feedGrade, cmcId = null) {
  const runId = ++_activeAnalysisRun;
  _activeAnalysisCgId = cgId;
  _lastSelectedCgId = cgId;
  _lastSelectedSymbol = symbol;
  _lastSelectedSafety = safetyScore;
  _lastSelectedFeed = feedGrade;
  _lastSelectedCmcId = cmcId || CMC_IDS_BY_SYMBOL[symbol] || null;
  selectedCgId = cgId;
  openMetric = null;
  renderTokenList();
  loadExchangeReferences(symbol);

  const panel = document.getElementById('detail-panel');
  panel.classList.add('fade-out');
  await new Promise(r => setTimeout(r, 150));
  if (runId !== _activeAnalysisRun || selectedCgId !== cgId) return;
  panel.classList.remove('fade-out');

  // Cached result: render immediately with no loading states
  if (resultCache.has(cgId)) {
    if (runId === _activeAnalysisRun) _activeAnalysisCgId = null;
    renderDetail(resultCache.get(cgId));
    return;
  }

  renderLoading('Fetching market data…');
  try {
    // Progressive: shows header after first fetch, then gates/metrics as each
    // API call resolves. renderDetail is called at the end with the full result.
    const result = await analyzeTokenProg(cgId, symbol, safetyScore, feedGrade, _lastSelectedCmcId);
    if (runId !== _activeAnalysisRun || selectedCgId !== cgId) return;
    _activeAnalysisCgId = null;
    if (result) {
      renderDetail(result);
      renderTokenList(); // refresh scores in left panel
    }
  } catch (err) {
    if (runId !== _activeAnalysisRun || selectedCgId !== cgId) return;
    _activeAnalysisCgId = null;
    renderError(err, symbol);
  }
}

function toggleMetric(key) {
  openMetric = openMetric === key ? null : key;
  // Close all, open the selected one
  document.querySelectorAll('.accordion-content').forEach(el => el.classList.remove('open'));
  if (openMetric) {
    const el = document.getElementById('acc-' + openMetric);
    if (el) el.classList.add('open');
  }
  // Update chevrons — onclick is on the .metric-row element itself
  document.querySelectorAll('.metric-row').forEach(row => {
    const onclick = row.getAttribute('onclick') || '';
    const match = onclick.match(/'([^']+)'/);
    const k = match ? match[1] : null;
    if (!k) return;
    const svg = row.querySelector('svg');
    if (!svg) return;
    const isO = openMetric === k;
    svg.style.transform = `rotate(${isO ? 90 : 0}deg)`;
    svg.style.color = isO ? 'var(--orange)' : 'var(--muted)';
  });
}

// ─── TOP COINS ────────────────────────────────────────────────────────────────
// Fetches top-50 by market cap, strips stables/wrapped tokens, keeps top 20.
// Falls back to KNOWN list on any network or parse error.
async function loadTopCoins() {
  try {
    const coins = await cgGet('/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50&page=1&sparkline=false');
    if (!Array.isArray(coins)) return;
    const filtered = coins.filter(c => c.id && c.symbol && !isExcluded(c)).slice(0, 20);
    if (!filtered.length) return;
    tokenList = filtered.map(c => {
      const sym = c.symbol.toUpperCase();
      const known = KNOWN[sym];
      return {
        symbol: sym,
        cgId:   c.id,
        cmcId:  known?.cmcId || CMC_IDS_BY_SYMBOL[sym],
        name:   c.name  || sym,
        rank:   c.market_cap_rank || null,
        thumb:  c.image || null,
        safetyScore: known?.safetyScore ?? 75,
        feedGrade:   known?.feedGrade   ?? 'A',
      };
    });
    renderTokenList();
  } catch (e) {
    // Keep the KNOWN list on failure; user can still search any token.
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
(function init() {
  loadSettings();
  updateSyncStamp();

  // Show users which live data paths the static page is using.
  {
    const notice = document.createElement('div');
    notice.style.cssText = 'background:rgba(148,163,184,0.05);border-bottom:1px solid var(--border);padding:5px 24px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative;z-index:1;';
    notice.innerHTML = `<svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>CoinGecko direct API with proxy fallback · RISEx/Lighter/Binance references with fallback · Hyperliquid direct${_IS_FILE ? ' (skipped on file://)' : ''}`;
    document.querySelector('#main-content').before(notice);
  }

  renderTokenList();
  renderWelcome();
  refreshSideRail();
  loadRiseMarkets();
  loadTrendingTokens();
  loadTopCoins();
  scheduleAutoRefresh();
})();
</script>
